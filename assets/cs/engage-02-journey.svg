<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Engage current-state journey map</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="700" fill="#F3EEE4"/><rect width="1200" height="700" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Current-state journey — “claim a travel expense”</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Shadowed with 6 employees on their own devices. Median 48 seconds to reach the form, 3 of 6 gave up.</text><rect x="48" y="118" width="1104" height="44" rx="12" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1.4" /><text x="140.0" y="146" font-size="12" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">1. Opens app</text><text x="324.0" y="146" font-size="12" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">2. Scans home</text><line x1="232.0" y1="118" x2="232.0" y2="518" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="3 4"/><text x="508.0" y="146" font-size="12" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">3. Guesses menu</text><line x1="416.0" y1="118" x2="416.0" y2="518" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="3 4"/><text x="692.0" y="146" font-size="12" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">4. Finds form</text><line x1="600.0" y1="118" x2="600.0" y2="518" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="3 4"/><text x="876.0" y="146" font-size="12" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">5. Submits</text><line x1="784.0" y1="118" x2="784.0" y2="518" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="3 4"/><text x="1060.0" y="146" font-size="12" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">6. Waits</text><line x1="968.0" y1="118" x2="968.0" y2="518" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="3 4"/><rect x="48" y="178" width="1104" height="150" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="62" y="198" font-size="9.5" fill="#7C7060" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1.1" opacity="1">EMOTION</text><path d="M140.0 314 L140 235 L324 258 L508 281 L692 258 L876 258 L1060 281 L1060.0 314 Z" fill="#D2461A" opacity=".08"/><path d="M140.0 235.0 C232.0 235.0 232.0 258.0 324.0 258.0 C416.0 258.0 416.0 281.0 508.0 281.0 C600.0 281.0 600.0 258.0 692.0 258.0 C784.0 258.0 784.0 258.0 876.0 258.0 C968.0 258.0 968.0 281.0 1060.0 281.0" stroke="#D2461A" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="140" cy="235" r="13" fill="#FBF7EF" stroke="#D2461A" stroke-width="2.2"/><circle cx="135.58" cy="232.66" r="1.7" fill="#D2461A"/><circle cx="144.42" cy="232.66" r="1.7" fill="#D2461A"/><path d="M133.24 238.9 Q140 241.63 146.76 238.9" stroke="#D2461A" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="324" cy="258" r="13" fill="#FBF7EF" stroke="#D2461A" stroke-width="2.2"/><circle cx="319.58" cy="255.66" r="1.7" fill="#D2461A"/><circle cx="328.42" cy="255.66" r="1.7" fill="#D2461A"/><path d="M317.24 261.9 Q324 261.9 330.76 261.9" stroke="#D2461A" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="508" cy="281" r="13" fill="#FBF7EF" stroke="#D2461A" stroke-width="2.2"/><circle cx="503.58" cy="278.66" r="1.7" fill="#D2461A"/><circle cx="512.42" cy="278.66" r="1.7" fill="#D2461A"/><path d="M501.24 284.9 Q508 282.16999999999996 514.76 284.9" stroke="#D2461A" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="692" cy="258" r="13" fill="#FBF7EF" stroke="#D2461A" stroke-width="2.2"/><circle cx="687.58" cy="255.66" r="1.7" fill="#D2461A"/><circle cx="696.42" cy="255.66" r="1.7" fill="#D2461A"/><path d="M685.24 261.9 Q692 261.9 698.76 261.9" stroke="#D2461A" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="876" cy="258" r="13" fill="#FBF7EF" stroke="#D2461A" stroke-width="2.2"/><circle cx="871.58" cy="255.66" r="1.7" fill="#D2461A"/><circle cx="880.42" cy="255.66" r="1.7" fill="#D2461A"/><path d="M869.24 261.9 Q876 261.9 882.76 261.9" stroke="#D2461A" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="1060" cy="281" r="13" fill="#FBF7EF" stroke="#D2461A" stroke-width="2.2"/><circle cx="1055.58" cy="278.66" r="1.7" fill="#D2461A"/><circle cx="1064.42" cy="278.66" r="1.7" fill="#D2461A"/><path d="M1053.24 284.9 Q1060 282.16999999999996 1066.76 284.9" stroke="#D2461A" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="48" y="342" width="1104" height="74" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="62" y="360" font-size="9.5" fill="#7C7060" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1.1" opacity="1">DOING</text><text x="62.0" y="380" font-size="10.2" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Cold start, splash</text><text x="62.0" y="393" font-size="10.2" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">2.4s</text><text x="246.0" y="380" font-size="10.2" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Reads 11 tiles twice</text><text x="430.0" y="380" font-size="10.2" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Taps “Services” —</text><text x="430.0" y="393" font-size="10.2" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">wrong</text><text x="614.0" y="380" font-size="10.2" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Uses search as a</text><text x="614.0" y="393" font-size="10.2" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">menu</text><text x="798.0" y="380" font-size="10.2" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Uploads photo of</text><text x="798.0" y="393" font-size="10.2" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">slip</text><text x="982.0" y="380" font-size="10.2" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">No status anywhere</text><rect x="48" y="424" width="1104" height="74" rx="12" fill="#FBE1D6" stroke="#D9D1C2" stroke-width="1.4" /><text x="62" y="442" font-size="9.5" fill="#7C7060" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1.1" opacity="1">PAIN</text><text x="62.0" y="462" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Login times out on</text><text x="62.0" y="475" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">3G</text><text x="246.0" y="462" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">No labels they use</text><text x="430.0" y="462" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Menu names are</text><text x="430.0" y="475" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">org-chart names</text><text x="614.0" y="462" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Search is the real</text><text x="614.0" y="475" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">IA</text><text x="798.0" y="462" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Upload fails</text><text x="798.0" y="475" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">silently</text><text x="982.0" y="462" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Phones the service</text><text x="982.0" y="475" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">desk</text><rect x="48" y="506" width="1104" height="74" rx="12" fill="#DAF0E5" stroke="#D9D1C2" stroke-width="1.4" /><text x="62" y="524" font-size="9.5" fill="#7C7060" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1.1" opacity="1">OPPORTUNITY</text><text x="62.0" y="544" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Session that</text><text x="62.0" y="557" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">survives</text><text x="246.0" y="544" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Show today, not</text><text x="246.0" y="557" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">everything</text><text x="430.0" y="544" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Rename around tasks</text><text x="614.0" y="544" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Promote search +</text><text x="614.0" y="557" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">recents</text><text x="798.0" y="544" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Optimistic save +</text><text x="798.0" y="557" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">retry</text><text x="982.0" y="544" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">One status timeline</text><rect x="48" y="592" width="1104" height="62" rx="12" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.4" /><text x="66" y="618" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">The finding that changed the brief</text><text x="66" y="638" font-size="11.5" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Nobody was lost inside a task — they were lost before it started. The problem was the home screen, not the forms.</text></svg>