<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 614" width="1200" height="614" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>TOBi conversation flow and content design</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="614" fill="#F3EEE4"/><rect width="1200" height="614" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Conversation design — the happy path and the three ways out</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Written as a script first, read aloud with the bursary office before a single node was built.</text><rect x="48" y="118" width="190" height="58" rx="12" fill="#D8EEF6" stroke="#0C7FA8" stroke-width="1.5" /><text x="143.0" y="144.0" font-size="11.5" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“bursary”</text><text x="143.0" y="161.0" font-size="9.5" fill="#7C7060" font-weight="600" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">any of 61 phrasings</text><path d="M238 147 L282 147" stroke="#7C7060" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M282 147 L275.6 149.9 L275.6 144.1 Z" fill="#7C7060"/><rect x="282" y="118" width="200" height="58" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.5" /><text x="382.0" y="144.0" font-size="11.5" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Recognise intent</text><text x="382.0" y="161.0" font-size="9.5" fill="#7C7060" font-weight="600" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">confidence ≥ 0.72</text><path d="M482 147 L526 147" stroke="#7C7060" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M526 147 L519.6 149.9 L519.6 144.1 Z" fill="#7C7060"/><rect x="526" y="106" width="210" height="82" rx="12" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.5" /><text x="631.0" y="144.0" font-size="11.5" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Ask ONE question</text><text x="631.0" y="161.0" font-size="9.5" fill="#7C7060" font-weight="600" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">employee, or applying from outside?</text><path d="M736 147 L782 147" stroke="#7C7060" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M782 147 L775.6 149.9 L775.6 144.1 Z" fill="#7C7060"/><rect x="782" y="118" width="190" height="58" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.5" /><text x="877.0" y="144.0" font-size="11.5" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Branch on answer</text><text x="877.0" y="161.0" font-size="9.5" fill="#7C7060" font-weight="600" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">2 paths, not 7</text><path d="M972 147 L1014 147" stroke="#7C7060" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M1014 147 L1007.6 149.9 L1007.6 144.1 Z" fill="#7C7060"/><rect x="1014" y="118" width="138" height="58" rx="12" fill="#DAF0E5" stroke="#1F8A57" stroke-width="1.5" /><text x="1083.0" y="144.0" font-size="11.5" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Answer + link</text><text x="1083.0" y="161.0" font-size="9.5" fill="#7C7060" font-weight="600" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">deep link to step 1</text><path d="M382 176 L382 232" stroke="#D2461A" stroke-width="1.8" fill="none" stroke-dasharray="5 5" stroke-linecap="round"/><path d="M382 232 L379.1 225.6 L384.9 225.6 Z" fill="#D2461A"/><rect x="282" y="232" width="200" height="62" rx="12" fill="#FBE1D6" stroke="#D2461A" stroke-width="1.5" /><text x="382.0" y="260.0" font-size="11.5" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Low confidence</text><text x="382.0" y="277.0" font-size="9.5" fill="#7C7060" font-weight="600" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">&lt; 0.72</text><path d="M482 263 L526 263" stroke="#D2461A" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M526 263 L519.6 265.9 L519.6 260.1 Z" fill="#D2461A"/><rect x="526" y="226" width="300" height="74" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.5" /><text x="676.0" y="260.0" font-size="11.5" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Offer the 3 nearest intents</text><text x="676.0" y="277.0" font-size="9.5" fill="#7C7060" font-weight="600" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">never “I didn&#x27;t get that” — always a next move</text><path d="M826 263 L874 263" stroke="#7C7060" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M874 263 L867.6 265.9 L867.6 260.1 Z" fill="#7C7060"/><rect x="874" y="232" width="278" height="62" rx="12" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.5" /><text x="1013.0" y="260.0" font-size="11.5" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Still stuck after 2 turns?</text><text x="1013.0" y="277.0" font-size="9.5" fill="#7C7060" font-weight="600" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">hand to a human, with the transcript</text><rect x="48" y="336" width="552" height="250" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="70" y="366" font-size="13" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Five rules the script had to obey</text><circle cx="84" cy="392" r="10" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.2"/><text x="84" y="396" font-size="10" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">1</text><text x="104" y="396" font-size="11" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">One question per turn. Never two.</text><circle cx="84" cy="421" r="10" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.2"/><text x="84" y="425" font-size="10" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">2</text><text x="104" y="425" font-size="11" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">No dead ends: every reply offers a next move.</text><circle cx="84" cy="450" r="10" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.2"/><text x="84" y="454" font-size="10" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">3</text><text x="104" y="454" font-size="11" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Two failed turns hands over to a human — with the</text><text x="104" y="469" font-size="11" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">transcript attached.</text><circle cx="84" cy="494" r="10" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.2"/><text x="84" y="498" font-size="10" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">4</text><text x="104" y="498" font-size="11" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Answer in the language the person opened in (EN,</text><text x="104" y="513" font-size="11" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">isiZulu, Sesotho, Afrikaans).</text><circle cx="84" cy="538" r="10" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.2"/><text x="84" y="542" font-size="10" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">5</text><text x="104" y="542" font-size="11" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Never say “I didn&#x27;t understand” without naming what it</text><text x="104" y="557" font-size="11" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">can do.</text><rect x="620" y="336" width="532" height="250" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="642" y="366" font-size="13" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Content design: same answer, half the words</text><rect x="642" y="382" width="488" height="84" rx="10" fill="#FBE1D6" stroke="#D2461A" stroke-width="1.2" /><text x="656" y="402" font-size="9.5" fill="#D2461A" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1.1" opacity="1">BEFORE — 61 WORDS</text><text x="656" y="420" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Thank you for contacting us. In order to determine your eligibility for</text><text x="656" y="433" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">the bursary programme, kindly refer to the eligibility criteria document</text><text x="656" y="446" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">available on the intranet portal under Human Resources / Learning and</text><text x="656" y="459" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Development / Bursaries.</text><rect x="642" y="480" width="488" height="84" rx="10" fill="#DAF0E5" stroke="#1F8A57" stroke-width="1.2" /><text x="656" y="500" font-size="9.5" fill="#1F8A57" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1.1" opacity="1">AFTER — 24 WORDS</text><text x="656" y="518" font-size="9.8" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">You qualify if you have worked here 12 months and passed your last review.</text><text x="656" y="531" font-size="9.8" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Two questions and I&#x27;ll check for you — ready?</text></svg>