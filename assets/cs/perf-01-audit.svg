<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Performance audit before and after</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="580" fill="#F3EEE4"/><rect width="1200" height="580" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">I audited my own site and did not like what I found</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">November baseline on a Moto G Power, Fast 3G, cold cache. The numbers below are all from that same rig.</text><rect x="48" y="112" width="540" height="268" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="70" y="142" font-size="12.5" fill="#D2461A" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Lighthouse — before</text><circle cx="140" cy="210" r="38" fill="none" stroke="#D9D1C2" stroke-width="8"/><circle cx="140" cy="210" r="38" fill="none" stroke="#D2461A" stroke-width="8" stroke-linecap="round" stroke-dasharray="97.9 238.8" transform="rotate(-90 140 210)"/><text x="140" y="217" font-size="22" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">41</text><text x="140" y="268" font-size="10" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Performance</text><circle cx="380" cy="210" r="38" fill="none" stroke="#D9D1C2" stroke-width="8"/><circle cx="380" cy="210" r="38" fill="none" stroke="#C98A00" stroke-width="8" stroke-linecap="round" stroke-dasharray="186.2 238.8" transform="rotate(-90 380 210)"/><text x="380" y="217" font-size="22" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">78</text><text x="380" y="268" font-size="10" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Accessibility</text><circle cx="140" cy="328" r="38" fill="none" stroke="#D9D1C2" stroke-width="8"/><circle cx="140" cy="328" r="38" fill="none" stroke="#C98A00" stroke-width="8" stroke-linecap="round" stroke-dasharray="198.2 238.8" transform="rotate(-90 140 328)"/><text x="140" y="335" font-size="22" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">83</text><text x="140" y="386" font-size="10" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Best practices</text><circle cx="380" cy="328" r="38" fill="none" stroke="#D9D1C2" stroke-width="8"/><circle cx="380" cy="328" r="38" fill="none" stroke="#C98A00" stroke-width="8" stroke-linecap="round" stroke-dasharray="171.9 238.8" transform="rotate(-90 380 328)"/><text x="380" y="335" font-size="22" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">72</text><text x="380" y="386" font-size="10" fill="#7C7060" font-weig