oke-linecap="round"/><path d="M154 535 L147.6 537.9 L147.6 532.1 Z" fill="#C3B9A6"/><text x="162" y="540" font-size="13" fill="#1F8A57" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">0.24 MB</text><text x="434" y="520" font-size="10.4" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Requests</text><text x="434" y="540" font-size="13" fill="#D2461A" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">74</text><path d="M492 535 L518 535" stroke="#C3B9A6" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M518 535 L511.6 537.9 L511.6 532.1 Z" fill="#C3B9A6"/><text x="526" y="540" font-size="13" fill="#1F8A57" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">18</text><text x="798" y="520" font-size="10.4" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Third-party scripts</text><text x="798" y="540" font-size="13" fill="#D2461A" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">6</text><path d="M856 535 L882 535" stroke="#C3B9A6" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M882 535 L875.6 537.9 L875.6 532.1 Z" fill="#C3B9A6"/><text x="890" y="540" font-size="13" fill="#1F8A57" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">0</text></svg>