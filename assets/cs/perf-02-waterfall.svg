<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Network waterfall before and after</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="650" fill="#F3EEE4"/><rect width="1200" height="650" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Where the six seconds went</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Network waterfall, same page, same connection. Left is what I inherited. Right is what ships now.</text><rect x="48" y="108" width="552" height="380" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="68" y="138" font-size="12.5" fill="#D2461A" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Before — 74 requests, 5.8 MB</text><text x="580" y="138" font-size="10.5" fill="#D2461A" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">6.9s to interactive</text><line x1="180" y1="152" x2="180" y2="456" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="2 4"/><text x="180.0" y="472" font-size="8.6" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Int