/><text x="580.0" y="472" font-size="8.6" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">7s</text><text x="68" y="176" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">document</text><rect x="180.0" y="167" width="28.6" height="13" rx="3" fill="#1A1208"/><text x="68" y="202" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">style.css</text><rect x="208.6" y="193" width="40.0" height="13" rx="3" fill="#6A45C4"/><text x="68" y="228" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">fonts.gstatic</text><rect x="214.3" y="219" width="62.9" height="13" rx="3" fill="#0C7FA8"/><text x="68" y="254" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">bootstrap.js</text><rect x="214.3" y="245" width="80.0" height="13" rx="3" fill="#C98A00"/><text x="68" y="280" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">jquery.js</text><rect x="220.0" y="271" width="51.4" height="13" rx="3" fill="#C98A00"/><text x="68" y="306" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">analytics-a.js</text><rect x="248.6" y="297" width="74.3" height="13" rx="3" fill="#B0A695"/><text x="68" y="332" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">analytics-b.js</text><rect x="260.0" y="323" width="85.7" height="13" rx="3" fill="#B0A695"/><text x="68" y="358" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">chat-widget.js</text><rect x="271.4" y="349" width="102.9" height="13" rx="3" fill="#B0A695"/><text x="68" y="384" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">hero.png 2.1MB</text><rect x="294.3" y="375" width="194.3" height="13" rx="3" fill="#D2461A"/><text x="68" y="410" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">gallery-1.png</text><rect x="317.1" y="401" width="165.7" height="13" rx="3" fill="#D2461A"/><text x="68" y="436" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">gallery-2.png</text><rect x="328.6" y="427" width="160.0" height="13" rx="3" fill="#D2461A"/><text x="68" y="462" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">icon-set.png</text><rect x="357.1" y="453" width="68.6" height="13" rx="3" fill="#D2461A"/><rect x="624" y="108" width="528" height="380" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="644" y="138" font-size="12.5" fill="#1F8A57" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">After — 18 requests, 240 KB</text><text x="1132" y="138" font-size="10.5" fill="#1F8A57" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">1.1s to interactive</text><line x1="756" y1="152" x2="756" y2="456" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="2 4"/><text x="756.0" y="472" font-size="8.6" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">0s</text><line x1="810" y1="152" x2="810" y2="456" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="2 4"/><text x="809.7142857142857" y="472" font-size="8.6" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">1s</text><line x1="863" y1="152" x2="863" y2="456" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="2 4"/><text x="863.4285714285714" y="472" font-size="8.6" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">2s</text><line x1="917" y1="152" x2="917" y2="456" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="2 4"/><text x="917.1428571428571" y="472" font-size="8.6" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">3s</text><line x1="971" y1="152" x2="971" y2="456" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="2 4"/><text x="970.8571428571429" y="472" font-size="8.6" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">4s</text><line x1="1025" y1="152" x2="1025" y2="456" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="2 4"/><text x="1024.5714285714284" y="472" font-size="8.6" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">5s</text><line x1="1078" y1="152" x2="1078" y2="456" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="2 4"/><text x="1078.2857142857142" y="472" font-size="8.6" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">6s</text><line x1="1132" y1="152" x2="1132" y2="456" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="2 4"/><text x="1132.0" y="472" font-size="8.6" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">7s</text><text x="644" y="176" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">document</text><rect x="756.0" y="167" width="17.2" height="13" rx="3" fill="#1A1208"/><text x="644" y="202" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">critical css</text><rect x="756.0" y="193" width="3.0" height="13" rx="3" fill="#6A45C4"/><text x="644" y="228" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">hero.webp 41KB</text><rect x="774.3" y="219" width="20.4" height="13" rx="3" fill="#D2461A"/><text x="644" y="254" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">app.js 24KB</text><rect x="774.3" y="245" width="16.1" height="13" rx="3" fill="#C98A00"/><text x="644" y="280" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">font (subset)</text><rect x="775.3" y="271" width="11.8" height="13" rx="3" fill="#0C7FA8"/><text x="644" y="306" font-size="9.2" fill="#7C7060" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">gallery (lazy)</text><rect x="825.8" y="297" width="10.7" height="13" rx="3" fill="#D2461A"/><rect x="48" y="508" width="12" height="12" rx="3" fill="#1A1208"/><text x="66" y="518" font-size="9.6" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Document</text><rect x="145.2" y="508" width="12" height="12" rx="3" fill="#6A45C4"/><text x="163.2" y="518" font-size="9.6" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">CSS</text><rect x="210.39999999999998" y="508" width="12" height="12" rx="3" fill="#C98A00"/><text x="228.39999999999998" y="518" font-size="9.6" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">JavaScript</text><rect x="320.4" y="508" width="12" height="12" rx="3" fill="#0C7FA8"/><text x="338.4" y="518" font-size="9.6" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Font</text><rect x="392.0" y="508" width="12" height="12" rx="3" fill="#D2461A"/><text x="410.0" y="518" font-size="9.6" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Image</text><rect x="470.0" y="508" width="12" height="12" rx="3" fill="#B0A695"/><text x="488.0" y="518" font-size="9.6" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Third party</text><rect x="48" y="536" width="1104" height="92" rx="12" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1.4" /><text x="70" y="564" font-size="12" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Six changes, in the order that mattered</text><text x="70" y="586" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">· Deleted 3 third-party scripts nobody had asked for in two years.</text><text x="622" y="586" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">· Re-encoded 41 images to WebP at the size they are actually displayed (−96% weight).</text><text x="70" y="603" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">· Inlined the 6 KB of CSS the first screen needs; the rest loads after paint.</text><text x="622" y="603" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">· Subset the font to the glyphs the site uses, self-hosted, preloaded.</text><text x="70" y="620" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">· Replaced jQuery + Bootstrap with 24 KB of hand-written JavaScript.</text><text x="622" y="620" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">· Reserved height on every image, which is where the 0.34 layout shift went.</text></svg>