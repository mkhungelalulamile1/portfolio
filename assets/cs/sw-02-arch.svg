<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 646" width="1200" height="646" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>ServiceWaze offline-first architecture</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="646" fill="#F3EEE4"/><rect width="1200" height="646" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Offline-first, because the network is the feature</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Angular 17 standalone components, a hand-written service worker, IndexedDB, and one rule about freshness.</text><rect x="48" y="118" width="210" height="96" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.5" /><rect x="48" y="118" width="210" height="4" rx="2" fill="#6A45C4"/><text x="64" y="146" font-size="12" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">UI layer</text><text x="64" y="164.0" font-size="9.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Standalone components. Pure inputs,</text><text x="64" y="176.5" font-size="9.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">no HTTP, no dates. Trivially</text><text x="64" y="189.0" font-size="9.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">testable.</text><path d="M258 166 L300 166" stroke="#7C7060" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M300 166 L293.6 168.9 L293.6 163.1 Z" fill="#7C7060"/><rect x="300" y="118" width="210" height="96" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.5" /><rect x="300" y="118" width="210" height="4" rx="2" fill="#0C7FA8"/><text x="316" y="146" font-size="12" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Signal store</text><text x="316" y="164.0" font-size="9.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">One state object per suburb: data,</text><text x="316" y="176.5" font-size="9.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">fetchedAt, source, status.</text><path d="M510 166 L552 166" stroke="#7C7060" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M552 166 L545.6 168.9 L545.6 163.1 Z" fill="#7C7060"/><rect x="552" y="118" width="230" height="96" rx="12" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.5" /><rect x="552" y="118" width="230" height="4" rx="2" fill="#C98A00"/><text x="568" y="146" font-size="12" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Resource gateway</text><text x="568" y="164.0" font-size="9.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Decides cache vs. network. The only place</text><text x="568" y="176.5" font-size="9.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">that knows about time.</text><path d="M782 166 L824 166" stroke="#7C7060" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M824 166 L817.6 168.9 L817.6 163.1 Z" fill="#7C7060"/><rect x="824" y="118" width="150" height="96" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.5" /><rect x="824" y="118" width="150" height="4" rx="2" fill="#1F8A57"/><text x="840" y="146" font-size="12" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Service worker</text><text x="840" y="164.0" font-size="9.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Stale-while-revalidate for</text><text x="840" y="176.5" font-size="9.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">reads, queue for writes.</text><path d="M974 166 L1010 166" stroke="#7C7060" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M1010 166 L1003.6 168.9 L1003.6 163.1 Z" fill="#7C7060"/><rect x="1010" y="118" width="142" height="96" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.5" /><rect x="1010" y="118" width="142" height="4" rx="2" fill="#D2461A"/><text x="1026" y="146" font-size="12" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">5 public APIs</text><text x="1026" y="164.0" font-size="9.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Eskom, city water, SAWS,</text><text x="1026" y="176.5" font-size="9.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">AQI, transport.</text><path d="M667 214 L667 258" stroke="#0C7FA8" stroke-width="2" fill="none" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M667 258 L664.1 251.6 L669.9 251.6 Z" fill="#0C7FA8"/><rect x="552" y="258" width="230" height="84" rx="12" fill="#D8EEF6" stroke="#0C7FA8" stroke-width="1.5" /><rect x="552" y="258" width="230" height="4" rx="2" fill="#0C7FA8"/><text x="568" y="286" font-size="12" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">IndexedDB</text><text x="568" y="304.0" font-size="9.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Last good payload per source, with its</text><text x="568" y="316.5" font-size="9.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">timestamp. Survives a cold start.</text><rect x="48" y="258" width="470" height="172" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="70" y="288" font-size="13" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">The freshness rule, written once</text><rect x="70" y="299" width="72" height="20" rx="10" fill="#1F8A57" opacity=".14"/><text x="106" y="313" font-size="9.4" fill="#1F8A57" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">&lt; 2 min</text><text x="154" y="313" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Fresh — show it plainly</text><rect x="70" y="329" width="72" height="20" rx="10" fill="#C98A00" opacity=".14"/><text x="106" y="343" font-size="9.4" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">2–15 min</text><text x="154" y="343" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Stale — show it, say how old</text><rect x="70" y="359" width="72" height="20" rx="10" fill="#D2461A" opacity=".14"/><text x="106" y="373" font-size="9.4" fill="#D2461A" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">&gt; 15 min</text><text x="154" y="373" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Last known — say so, offer refresh</text><rect x="70" y="389" width="72" height="20" rx="10" fill="#7C7060" opacity=".14"/><text x="106" y="403" font-size="9.4" fill="#7C7060" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">no cache</text><text x="154" y="403" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Empty state, never a spinner forever</text><rect x="812" y="258" width="340" height="172" rx="14" fill="#101014" stroke="#26262B" stroke-width="1.4" /><text x="834" y="286" font-size="10" fill="#94908A" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">gateway.ts — the whole decision</text><text x="834" y="312" font-size="9.6" fill="#F0EDE6" font-weight="500" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">const age = now - cached.fetchedAt;</text><text x="834" y="331" font-size="9.6" fill="#8FCFA8" font-weight="500" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">if (age &lt; FRESH) return cached.value;</text><text x="834" y="350" font-size="9.6" fill="#6E6A64" font-weight="500" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">void revalidate();      // fire &amp; forget</text><text x="834" y="369" font-size="9.6" fill="#E8C46A" font-weight="500" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">if (age &lt; STALE) return stale(cached);</text><text x="834" y="388" font-size="9.6" fill="#F0A18C" font-weight="500" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">if (offline) return lastKnown(cached);</text><text x="834" y="407" font-size="9.6" fill="#F0EDE6" font-weight="500" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">return await network();</text><rect x="48" y="452" width="1104" height="84" rx="12" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1.4" /><text x="70" y="480" font-size="12" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">What this bought</text><text x="70" y="508" font-size="19" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">0</text><text x="70" y="524" font-size="9.8" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">spinners that never end</text><text x="288" y="508" font-size="19" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">100%</text><text x="288" y="524" font-size="9.8" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">screens usable offline</text><line x1="266" y1="490" x2="266" y2="528" stroke="#D9D1C2" stroke-width="1"/><text x="506" y="508" font-size="19" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">1</text><text x="506" y="524" font-size="9.8" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">place that knows about time</text><line x1="484" y1="490" x2="484" y2="528" stroke="#D9D1C2" stroke-width="1"/><text x="724" y="508" font-size="19" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">38</text><text x="724" y="524" font-size="9.8" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">tests on the gateway alone</text><line x1="702" y1="490" x2="702" y2="528" stroke="#D9D1C2" stroke-width="1"/><text x="942" y="508" font-size="19" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">2.1 KB</text><text x="942" y="524" font-size="9.8" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">of that logic, gzipped</text><line x1="920" y1="490" x2="920" y2="528" stroke="#D9D1C2" stroke-width="1"/><rect x="48" y="552" width="1104" height="62" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="70" y="578" font-size="12" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">The mistake I made first</text><text x="70" y="598" font-size="11" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Version one cached in the components. Three components disagreed about what “now” meant and the UI flickered. Moving time into one gateway fixed a class of bug, not a bug.</text></svg>