<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Bursary form redesign</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="660" fill="#F3EEE4"/><rect width="1200" height="660" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">42 fields on one page → 4 steps that save themselves</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Field-by-field audit: what is it for, who reads it, can we already know it? 17 fields could not answer.</text><rect x="48" y="112" width="400" height="452" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><rect x="48" y="112" width="400" height="38" rx="14" fill="#FBE1D6" stroke="none" stroke-width="0" /><rect x="48" y="136" width="400" height="14" fill="#FBE1D6"/><text x="68" y="137" font-size="11" fill="#D2461A" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.6" opacity="1">BEFORE — one page, 42 fields</text><rect x="68" y="166" width="60" height="8" rx="4.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="68" y="177" width="360" height="14" rx="8" fill="#F2EEE6" stroke="#C3B9A6" stroke-width="1.2" /><rect x="68" y="193" width="84" height="8" rx="4.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="68" y="204" width="360" height="14" rx="8" fill="#F2EEE6" stroke="#C3B9A6" stroke-width="1.2" /><rect x="68" y="220" width="108" height="8" rx="4.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="68" y="231" width="360" height="14" rx="8" fill="#F2EEE6" stroke="#C3B9A6" stroke-width="1.2" /><rect x="68" y="247" width="60" height="8" rx="4.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="68" y="258" width="360" height="14" rx="8" fill="#F2EEE6" stroke="#C3B9A6" stroke-width="1.2" /><rect x="68" y="274" width="84" height="8" rx="4.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="68" y="285" width="360" height="14" rx="8" fill="#F2EEE6" stroke="#C3B9A6" stroke-width="1.2" /><rect x="68" y="301" width="108" height="8" rx="4.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="68" y="312" width="360" height="14" rx="8" fill="#F2EEE6" stroke="#C3B9A6" stroke-width="1.2" /><rect x="68" y="328" width="60" height="8" rx="4.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="68" y="339" width="360" height="14" rx="8" fill="#F2EEE6" stroke="#C3B9A6" stroke-width="1.2" /><rect x="68" y="355" width="84" height="8" rx="4.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="68" y="366" width="360" height="14" rx="8" fill="#F2EEE6" stroke="#C3B9A6" stroke-width="1.2" /><rect x="68" y="382" width="108" height="8" rx="4.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="68" y="393" width="360" height="14" rx="8" fill="#F2EEE6" stroke="#C3B9A6" stroke-width="1.2" /><rect x="68" y="409" width="60" height="8" rx="4.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="68" y="420" width="360" height="14" rx="8" fill="#F2EEE6" stroke="#C3B9A6" stroke-width="1.2" /><line x1="68" y1="444" x2="428" y2="444" stroke="#D9D1C2" stroke-width="1" stroke-dasharray="4 4"/><text x="68" y="464" font-size="10.5" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">…32 more fields below the fold</text><rect x="68" y="478" width="360" height="30" rx="7" fill="#F3EEE4" stroke="#D2461A" stroke-width="1.2" /><text x="84" y="498" font-size="10" fill="#D2461A" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">No progress bar. No save. No way back.</text><rect x="68" y="516" width="360" height="34" rx="8" fill="#FBE1D6" stroke="#D2461A" stroke-width="1.2" /><text x="84" y="538" font-size="11" fill="#D2461A" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">60% abandonment · 38% completion</text><path d="M464 340 L508 340" stroke="#C98A00" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M508 340 L501.6 342.9 L501.6 337.1 Z" fill="#C98A00"/><rect x="524" y="112" width="628" height="452" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><rect x="524" y="112" width="628" height="38" rx="14" fill="#DAF0E5" stroke="none" stroke-width="0" /><rect x="524" y="136" width="628" height="14" fill="#DAF0E5"/><text x="544" y="137" font-size="11" fill="#1F8A57" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.6" opacity="1">AFTER — 4 steps, 25 fields, autosaves every answer</text><rect x="544" y="168" width="588" height="62" rx="11" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.2" /><circle cx="574" cy="199" r="15" fill="#1F8A57"/><text x="574" y="204" font-size="13" fill="#FFF" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">1</text><text x="602" y="194" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">You</text><text x="602" y="212" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">4 fields — 3 pre-filled from your staff record</text><text x="1112" y="204" font-size="15" fill="#1F8A57" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">✓</text><rect x="544" y="242" width="588" height="62" rx="11" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.2" /><circle cx="574" cy="273" r="15" fill="#1F8A57"/><text x="574" y="278" font-size="13" fill="#FFF" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">2</text><text x="602" y="268" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Your studies</text><text x="602" y="286" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">6 fields — institution list, not free text</text><text x="1112" y="278" font-size="15" fill="#1F8A57" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">✓</text><rect x="544" y="316" width="588" height="62" rx="11" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.2" /><circle cx="574" cy="347" r="15" fill="#C98A00"/><text x="574" y="352" font-size="13" fill="#FFF" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">3</text><text x="602" y="342" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Documents</text><text x="602" y="360" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">3 uploads — camera-first, 8 MB limit stated up front</text><text x="1112" y="352" font-size="15" fill="#1F8A57" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">✓</text><rect x="544" y="390" width="588" height="62" rx="11" fill="#FBF7EF" stroke="#C3B9A6" stroke-width="1.2" /><circle cx="574" cy="421" r="15" fill="#C9C2B6"/><text x="574" y="426" font-size="13" fill="#FFF" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">4</text><text x="602" y="416" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Check &amp; send</text><text x="602" y="434" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">read-only summary, one edit link per section</text><text x="544" y="486" font-size="10.5" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Progress saved · you can close this and come back</text><rect x="544" y="496" width="588" height="10" rx="5" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="544" y="496" width="441.0" height="10" rx="5" fill="#1F8A57" stroke="none" stroke-width="0" /><rect x="544" y="518" width="588" height="34" rx="8" fill="#DAF0E5" stroke="#1F8A57" stroke-width="1.2" /><text x="560" y="540" font-size="11" fill="#1F8A57" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">22% abandonment · 61% completion · median 9 min (was 40)</text><rect x="48" y="584" width="208" height="58" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="152.0" y="615.0" font-size="26" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">42 → 25</text><text x="152.0" y="630" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">fields</text><rect x="272" y="584" width="208" height="58" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="376.0" y="615.0" font-size="26" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">17</text><text x="376.0" y="630" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">fields removed or inferred</text><rect x="496" y="584" width="208" height="58" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="600.0" y="615.0" font-size="26" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">+61%</text><text x="600.0" y="630" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">completion</text><rect x="720" y="584" width="208" height="58" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="824.0" y="615.0" font-size="26" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">−78%</text><text x="824.0" y="630" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“where is my application?” calls</text><rect x="944" y="584" width="208" height="58" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="1048.0" y="615.0" font-size="26" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">4</text><text x="1048.0" y="630" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">languages supported</text></svg>