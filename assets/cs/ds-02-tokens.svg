<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Token architecture in three layers</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="600" fill="#F3EEE4"/><rect width="1200" height="600" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Three layers, and a rule about which one you may touch</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Designers work in semantic. Product teams work in component. Nobody but me edits primitives.</text><rect x="48" y="116" width="356" height="300" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><rect x="48" y="116" width="356" height="40" rx="14" fill="#E7DFFA" stroke="none" stroke-width="0" /><rect x="48" y="136" width="356" height="20" fill="#E7DFFA"/><text x="66" y="141" font-size="10.5" fill="#6A45C4" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.8" opacity="1">01 · PRIMITIVE</text><text x="66" y="176" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Raw values. No meaning. Never referenced by</text><text x="66" y="189" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">a component.</text><rect x="66" y="226" width="320" height="32" rx="8" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.1" /><text x="78" y="246" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">brand.amber.500</text><rect x="348" y="234" width="26" height="16" rx="4" fill="#F0A500" stroke="#D9D1C2" stroke-width="1" /><rect x="66" y="266" width="320" height="32" rx="8" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.1" /><text x="78" y="286" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">neutral.900</text><rect x="348" y="274" width="26" height="16" rx="4" fill="#0E0E10" stroke="#D9D1C2" stroke-width="1" /><rect x="66" y="306" width="320" height="32" rx="8" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.1" /><text x="78" y="326" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">neutral.050</text><rect x="348" y="314" width="26" height="16" rx="4" fill="#F5EDD8" stroke="#D9D1C2" stroke-width="1" /><rect x="66" y="346" width="320" height="32" rx="8" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.1" /><text x="78" y="366" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">red.600</text><rect x="348" y="354" width="26" height="16" rx="4" fill="#E04E14" stroke="#D9D1C2" stroke-width="1" /><path d="M404 266 L420 266" stroke="#7C7060" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M420 266 L413.6 268.9 L413.6 263.1 Z" fill="#7C7060"/><rect x="420" y="116" width="356" height="300" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><rect x="420" y="116" width="356" height="40" rx="14" fill="#D8EEF6" stroke="none" stroke-width="0" /><rect x="420" y="136" width="356" height="20" fill="#D8EEF6"/><text x="438" y="141" font-size="10.5" fill="#0C7FA8" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.8" opacity="1">02 · SEMANTIC</text><text x="438" y="176" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">What the value is for. Flips with the mode.</text><text x="438" y="189" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">This is the layer designers use.</text><rect x="438" y="226" width="320" height="32" rx="8" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.1" /><text x="450" y="246" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">surface.base</text><text x="746" y="246" font-size="9" fill="#0C7FA8" font-weight="700" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">→ neutral.900</text><rect x="438" y="266" width="320" height="32" rx="8" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.1" /><text x="450" y="286" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">text.high</text><text x="746" y="286" font-size="9" fill="#0C7FA8" font-weight="700" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">→ neutral.050</text><rect x="438" y="306" width="320" height="32" rx="8" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.1" /><text x="450" y="326" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">action.primary</text><text x="746" y="326" font-size="9" fill="#0C7FA8" font-weight="700" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">→ brand.amber.500</text><rect x="438" y="346" width="320" height="32" rx="8" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.1" /><text x="450" y="366" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">status.danger</text><text x="746" y="366" font-size="9" fill="#0C7FA8" font-weight="700" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">→ red.600</text><path d="M776 266 L792 266" stroke="#7C7060" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M792 266 L785.6 268.9 L785.6 263.1 Z" fill="#7C7060"/><rect x="792" y="116" width="356" height="300" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><rect x="792" y="116" width="356" height="40" rx="14" fill="#FCEFCB" stroke="none" stroke-width="0" /><rect x="792" y="136" width="356" height="20" fill="#FCEFCB"/><text x="810" y="141" font-size="10.5" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.8" opacity="1">03 · COMPONENT</text><text x="810" y="176" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Scoped to one component. Defaults to a</text><text x="810" y="189" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">semantic token, overridable per product.</text><rect x="810" y="226" width="320" height="32" rx="8" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.1" /><text x="822" y="246" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">button.bg.rest</text><text x="1118" y="246" font-size="9" fill="#C98A00" font-weight="700" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">→ action.primary</text><rect x="810" y="266" width="320" height="32" rx="8" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.1" /><text x="822" y="286" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">button.text.rest</text><text x="1118" y="286" font-size="9" fill="#C98A00" font-weight="700" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">→ surface.base</text><rect x="810" y="306" width="320" height="32" rx="8" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.1" /><text x="822" y="326" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">card.border</text><text x="1118" y="326" font-size="9" fill="#C98A00" font-weight="700" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">→ border.subtle</text><rect x="810" y="346" width="320" height="32" rx="8" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.1" /><text x="822" y="366" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">input.ring.focus</text><text x="1118" y="366" font-size="9" fill="#C98A00" font-weight="700" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">→ action.primary</text><rect x="48" y="436" width="1104" height="142" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="70" y="464" font-size="13" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">How one value resolves — and why light mode needs no extra work</text><rect x="70" y="486" width="210" height="40" rx="9" fill="#F3EEE4" stroke="#C98A00" stroke-width="1.4" /><text x="175" y="511" font-size="10.4" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">button.bg.rest</text><path d="M280 506 L320 506" stroke="#7C7060" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M320 506 L313.6 508.9 L313.6 503.1 Z" fill="#7C7060"/><rect x="320" y="486" width="210" height="40" rx="9" fill="#F3EEE4" stroke="#0C7FA8" stroke-width="1.4" /><text x="425" y="511" font-size="10.4" fill="#0C7FA8" font-weight="800" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">action.primary</text><path d="M530 506 L570 506" stroke="#7C7060" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M570 506 L563.6 508.9 L563.6 503.1 Z" fill="#7C7060"/><rect x="570" y="486" width="210" height="40" rx="9" fill="#F3EEE4" stroke="#6A45C4" stroke-width="1.4" /><text x="675" y="511" font-size="10.4" fill="#6A45C4" font-weight="800" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">brand.amber.500</text><path d="M780 506 L820 506" stroke="#7C7060" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M820 506 L813.6 508.9 L813.6 503.1 Z" fill="#7C7060"/><rect x="820" y="486" width="210" height="40" rx="9" fill="#F3EEE4" stroke="#1A1208" stroke-width="1.4" /><text x="925" y="511" font-size="10.4" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">#F0A500</text><text x="70" y="552" font-size="10.6" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">In light mode only the semantic layer changes: action.primary → brand.amber.700. Components are untouched, so nothing can be missed.</text><rect x="70" y="560" width="1060" height="1" rx="0.5" fill="#D9D1C2" stroke="none" stroke-width="0" /></svg>