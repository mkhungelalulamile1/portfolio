vetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Could not reach source</text><rect x="434" y="552" width="320" height="26" rx="7" fill="#241D07" stroke="#C98A00" stroke-width="1" /><text x="446" y="570" font-size="8.8" fill="#C98A00" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">2 sources timed out. Retrying in 30s.</text><text x="420" y="362" font-size="9.5" fill="#7C7060" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1" opacity="1">05 · PARTIAL</text><rect x="792" y="370" width="348" height="226" rx="14" fill="#0E0E10" stroke="#26262B" stroke-width="1.4" /><rect x="792" y="370" width="348" height="38" rx="14" fill="#17171A"/><rect x="792" y="394" width="348" height="14" fill="#17171A"/><text x="806" y="394" font-size="10.5" fill="#F0EDE6" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Midrand, Gauteng</text><rect x="1037.2" y="379" width="80.09" height="18" rx="9.0" fill="none" stroke="#94908A" stroke-width="1" /><text x="1077.2450000000001" y="391.4" font-size="8.5" fill="#94908A" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">no suburb yet</text><circle cx="966" cy="474" r="24" fill="none" stroke="#33333A" stroke-width="2.4"/><path d="M958 474 l6 6 l12 -14" stroke="#33333A" stroke-width="2.4" fill="none" stroke-linecap="round"/><text x="966" y="518" font-size="10.5" fill="#94908A" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Pick a suburb to start</text><rect x="896" y="532" width="140" height="30" rx="8" fill="#C98A00" stroke="none" stroke-width="0" /><text x="966" y="552" font-size="9.6" fill="#17140F" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Use my location</text><text x="792" y="362" font-size="9.5" fill="#7C7060" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1" opacity="1">06 · EMPTY</text><rect x="48" y="630" width="1104" height="54" rx="12" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.4" /><text x="68" y="654" font-size="11.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Rule</text><text x="116" y="654" font-size="11.5" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">the app never shows a blank screen and never shows a stale number without saying it is stale. Both are one component with a state prop.</text><text x="68" y="674" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Every state has a written copy string, a colour token and an aria-live announcement. Nothing here is decoration.</text></svg>