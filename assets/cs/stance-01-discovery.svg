<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Stance discovery research</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="700" fill="#F3EEE4"/><rect width="1200" height="700" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Discovery — a market that kept being told “no”</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">South Africa&#x27;s modified-car community. 9 broker interviews, 214 forum posts coded, 3 ride-alongs.</text><rect x="48" y="112" width="560" height="268" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="70" y="142" font-size="13" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">What actually happens today</text><circle cx="88" cy="178" r="7" fill="#7C7060"/><line x1="88" y1="186" x2="88" y2="206" stroke="#C3B9A6" stroke-width="2"/><text x="106" y="182" font-size="11.5" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Owner fits an exhaust</text><circle cx="88" cy="214" r="7" fill="#7C7060"/><line x1="88" y1="222" x2="88" y2="242" stroke="#C3B9A6" stroke-width="2"/><text x="106" y="218" font-size="11.5" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Declares it</text><circle cx="88" cy="250" r="7" fill="#D2461A"/><line x1="88" y1="258" x2="88" y2="278" stroke="#C3B9A6" stroke-width="2"/><text x="106" y="254" font-size="11.5" fill="#D2461A" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Insurer loads or refuses</text><circle cx="88" cy="286" r="7" fill="#D2461A"/><line x1="88" y1="294" x2="88" y2="314" stroke="#C3B9A6" stroke-width="2"/><text x="106" y="290" font-size="11.5" fill="#D2461A" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Owner stops declaring</text><circle cx="88" cy="322" r="7" fill="#D2461A"/><text x="106" y="326" font-size="11.5" fill="#D2461A" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Claim rejected later</text><rect x="70" y="332" width="516" height="32" rx="8" fill="#FBE1D6" stroke="#D2461A" stroke-width="1.2" /><text x="86" y="353" font-size="11" fill="#D2461A" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">7 of 9 brokers said they simply decline the segment.</text><rect x="628" y="112" width="524" height="268" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="650" y="142" font-size="13" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Evidence from 214 forum posts</text><text x="650" y="181" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Refused cover outright</text><text x="1130" y="181" font-size="10.6" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">96</text><rect x="650" y="188" width="460" height="9" rx="4.5" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="650" y="188" width="339.6923076923077" height="9" rx="4.5" fill="#C98A00" stroke="none" stroke-width="0" /><text x="650" y="217" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Premium loaded 40%+</text><text x="1130" y="217" font-size="10.6" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">61</text><rect x="650" y="224" width="460" height="9" rx="4.5" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="650" y="224" width="215.84615384615384" height="9" rx="4.5" fill="#C98A00" stroke="none" stroke-width="0" /><text x="650" y="253" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Claim rejected for a mod</text><text x="1130" y="253" font-size="10.6" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">38</text><rect x="650" y="260" width="460" height="9" rx="4.5" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="650" y="260" width="134.46153846153845" height="9" rx="4.5" fill="#C98A00" stroke="none" stroke-width="0" /><text x="650" y="289" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Stopped declaring mods</text><text x="1130" y="289" font-size="10.6" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">71</text><rect x="650" y="296" width="460" height="9" rx="4.5" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="650" y="296" width="251.23076923076923" height="9" rx="4.5" fill="#C98A00" stroke="none" stroke-width="0" /><text x="650" y="325" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Wanted agreed value</text><text x="1130" y="325" font-size="10.6" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">118</text><rect x="650" y="332" width="460" height="9" rx="4.5" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="650" y="332" width="417.53846153846155" height="9" rx="4.5" fill="#C98A00" stroke="none" stroke-width="0" /><rect x="48" y="398" width="356" height="196" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><rect x="48" y="398" width="356" height="5" rx="2.5" fill="#6A45C4"/><circle cx="86" cy="438" r="20" fill="#6A45C4" opacity=".16"/><text x="86" y="444" font-size="17" fill="#6A45C4" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">S</text><text x="118" y="432" font-size="13.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Sipho, 29</text><text x="118" y="449" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Golf 7 GTI · Soweto</text><text x="68" y="484.0" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“If I tell them about the mods the price</text><text x="68" y="498.5" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">doubles. If I don&#x27;t, I&#x27;m not covered. So I</text><text x="68" y="513.0" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">just drive carefully.”</text><rect x="68" y="556" width="316" height="26" rx="7" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1" /><text x="80" y="573" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Job to be done: Price certainty before declaring</text><rect x="420" y="398" width="356" height="196" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><rect x="420" y="398" width="356" height="5" rx="2.5" fill="#0C7FA8"/><circle cx="458" cy="438" r="20" fill="#0C7FA8" opacity=".16"/><text x="458" y="444" font-size="17" fill="#0C7FA8" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">R</text><text x="490" y="432" font-size="13.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Rethabile, 34</text><text x="490" y="449" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Ranger build · Polokwane</text><text x="440" y="484.0" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“It works Monday to Friday and climbs on</text><text x="440" y="498.5" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Saturday. I need the canopy and winch named on</text><text x="440" y="513.0" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">the schedule.”</text><rect x="440" y="556" width="316" height="26" rx="7" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1" /><text x="452" y="573" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Job to be done: Named parts on the schedule</text><rect x="792" y="398" width="356" height="196" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><rect x="792" y="398" width="356" height="5" rx="2.5" fill="#C98A00"/><circle cx="830" cy="438" r="20" fill="#C98A00" opacity=".16"/><text x="830" y="444" font-size="17" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">D</text><text x="862" y="432" font-size="13.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Dean, 41</text><text x="862" y="449" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">E30 restoration · Cape Town</text><text x="812" y="484.0" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“Market value is meaningless on a car like</text><text x="812" y="498.5" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">this. Give me an agreed value, photos on file,</text><text x="812" y="513.0" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">my own repairer.”</text><rect x="812" y="556" width="316" height="26" rx="7" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1" /><text x="824" y="573" font-size="9.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Job to be done: Agreed value, not market value</text><rect x="48" y="612" width="1104" height="62" rx="12" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.4" /><text x="68" y="638" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">The bet</text><text x="68" y="660" font-size="11.5" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">If declaring mods made the price go DOWN in some cases — because the car is better maintained — the whole funnel changes. That became the product.</text></svg>