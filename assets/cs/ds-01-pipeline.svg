<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Design token pipeline</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="620" fill="#F3EEE4"/><rect width="1200" height="620" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">One source of truth, four places it lands</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Figma variables are the source. Everything downstream is generated. Nobody types a hex value by hand.</text><rect x="48" y="116" width="216" height="104" rx="13" fill="#E7DFFA" stroke="#6A45C4" stroke-width="1.5" /><text x="64" y="146" font-size="13" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Figma variables</text><text x="64" y="168" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">3 collections, 2 modes</text><text x="64" y="183" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">light / dark</text><path d="M264 168 L298 168" stroke="#7C7060" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M298 168 L291.6 170.9 L291.6 165.1 Z" fill="#7C7060"/><rect x="298" y="116" width="216" height="104" rx="13" fill="#D8EEF6" stroke="#0C7FA8" stroke-width="1.5" /><text x="314" y="146" font-size="13" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">tokens.json</text><text x="314" y="168" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">exported by a plugin</text><text x="314" y="183" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">committed to git</text><path d="M514 168 L548 168" stroke="#7C7060" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M548 168 L541.6 170.9 L541.6 165.1 Z" fill="#7C7060"/><rect x="548" y="116" width="216" height="104" rx="13" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.5" /><text x="564" y="146" font-size="13" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Style Dictionary</text><text x="564" y="168" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">one transform per</text><text x="564" y="183" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">platform</text><path d="M764 168 L798 168" stroke="#7C7060" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M798 168 L791.6 170.9 L791.6 165.1 Z" fill="#7C7060"/><rect x="798" y="116" width="216" height="104" rx="13" fill="#DAF0E5" stroke="#1F8A57" stroke-width="1.5" /><text x="814" y="146" font-size="13" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Build outputs</text><text x="814" y="168" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">CSS · SCSS · TS · XML</text><path d="M958 220 V236 H806 V461 " stroke="#C3B9A6" stroke-width="1.4" fill="none"/><line x1="806" y1="275" x2="830" y2="275" stroke="#C3B9A6" stroke-width="1.4"/><circle cx="806" cy="275" r="3" fill="#C3B9A6"/><rect x="830" y="250" width="322" height="50" rx="10" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.3" /><rect x="830" y="250" width="4" height="50" rx="2" fill="#0C7FA8"/><text x="848" y="272" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">web/tokens.css</text><text x="848" y="288" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">custom properties</text><line x1="806" y1="337" x2="830" y2="337" stroke="#C3B9A6" stroke-width="1.4"/><circle cx="806" cy="337" r="3" fill="#C3B9A6"/><rect x="830" y="312" width="322" height="50" rx="10" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.3" /><rect x="830" y="312" width="4" height="50" rx="2" fill="#D2461A"/><text x="848" y="334" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">angular/_tokens.scss</text><text x="848" y="350" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">mixins + maps</text><line x1="806" y1="399" x2="830" y2="399" stroke="#C3B9A6" stroke-width="1.4"/><circle cx="806" cy="399" r="3" fill="#C3B9A6"/><rect x="830" y="374" width="322" height="50" rx="10" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.3" /><rect x="830" y="374" width="4" height="50" rx="2" fill="#C98A00"/><text x="848" y="396" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">ts/tokens.ts</text><text x="848" y="412" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">typed constants</text><line x1="806" y1="461" x2="830" y2="461" stroke="#C3B9A6" stroke-width="1.4"/><circle cx="806" cy="461" r="3" fill="#C3B9A6"/><rect x="830" y="436" width="322" height="50" rx="10" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.3" /><rect x="830" y="436" width="4" height="50" rx="2" fill="#1F8A57"/><text x="848" y="458" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">android/colors.xml</text><text x="848" y="474" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">resource values</text><rect x="48" y="250" width="750" height="248" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="70" y="280" font-size="13" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">The gate that stops drift</text><text x="70" y="298" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">A pull request cannot merge if any of these fail</text><circle cx="84" cy="316" r="8" fill="#1F8A57"/><path d="M80 316 l3 3 l5.5 -6.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="102" y="320" font-size="10.6" fill="#1A1208" font-weight="800" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">no-raw-colour</text><text x="240" y="320" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">eslint rule: a hex literal in a component is an error</text><circle cx="84" cy="346" r="8" fill="#1F8A57"/><path d="M80 346 l3 3 l5.5 -6.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="102" y="350" font-size="10.6" fill="#1A1208" font-weight="800" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">token-diff</text><text x="240" y="350" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">posts a table of every changed token on the PR</text><circle cx="84" cy="376" r="8" fill="#1F8A57"/><path d="M80 376 l3 3 l5.5 -6.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="102" y="380" font-size="10.6" fill="#1A1208" font-weight="800" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">contrast</text><text x="240" y="380" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">every semantic pair checked against WCAG AA, both modes</text><circle cx="84" cy="406" r="8" fill="#1F8A57"/><path d="M80 406 l3 3 l5.5 -6.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="102" y="410" font-size="10.6" fill="#1A1208" font-weight="800" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">visual-diff</text><text x="240" y="410" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Storybook snapshots, 1% threshold</text><circle cx="84" cy="436" r="8" fill="#1F8A57"/><path d="M80 436 l3 3 l5.5 -6.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="102" y="440" font-size="10.6" fill="#1A1208" font-weight="800" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">a11y</text><text x="240" y="440" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">axe on every story, zero criticals</text><circle cx="84" cy="466" r="8" fill="#C98A00"/><path d="M80 466 l3 3 l5.5 -6.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="102" y="470" font-size="10.6" fill="#1A1208" font-weight="800" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0" opacity="1">bundle</text><text x="240" y="470" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">the token layer must stay under 6 KB</text><rect x="48" y="518" width="1104" height="76" rx="12" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.4" /><text x="70" y="546" font-size="12" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Before this existed</text><text x="70" y="568" font-size="11.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">213 hard-coded colours across 4 products, a brand refresh estimated at 6 weeks, and a QA backlog where “wrong shade of grey” was a recurring ticket type.</text><text x="70" y="586" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">After: the same refresh took 2 days, most of which was screenshots for sign-off.</text></svg>