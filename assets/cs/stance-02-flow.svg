<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 726" width="1200" height="726" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Stance quote flow and interface decisions</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="726" fill="#F3EEE4"/><rect width="1200" height="726" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">From a 27-question form to a 4-minute quote</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Prototyped in Figma, tested with 11 owners at two car meets on their own phones, outdoors, in daylight.</text><rect x="48" y="112" width="258" height="78" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><circle cx="78" cy="151" r="16" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.4"/><text x="78" y="156" font-size="13" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">1</text><text x="106" y="145" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Your car</text><text x="106" y="163" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">reg lookup fills 9 fields</text><path d="M306 151 L330 151" stroke="#C3B9A6" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M330 151 L323.6 153.9 L323.6 148.1 Z" fill="#C3B9A6"/><rect x="330" y="112" width="258" height="78" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><circle cx="360" cy="151" r="16" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.4"/><text x="360" y="156" font-size="13" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">2</text><text x="388" y="145" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Your mods</text><text x="388" y="163" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">visual picker, not free</text><text x="388" y="175" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">text</text><path d="M588 151 L612 151" stroke="#C3B9A6" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M612 151 L605.6 153.9 L605.6 148.1 Z" fill="#C3B9A6"/><rect x="612" y="112" width="258" height="78" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><circle cx="642" cy="151" r="16" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.4"/><text x="642" y="156" font-size="13" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">3</text><text x="670" y="145" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Your cover</text><text x="670" y="163" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">agreed vs market, side by</text><text x="670" y="175" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">side</text><path d="M870 151 L894 151" stroke="#C3B9A6" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M894 151 L887.6 153.9 L887.6 148.1 Z" fill="#C3B9A6"/><rect x="894" y="112" width="258" height="78" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><circle cx="924" cy="151" r="16" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.4"/><text x="924" y="156" font-size="13" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">4</text><text x="952" y="145" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Your price</text><text x="952" y="163" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">monthly, with the mods</text><text x="952" y="175" font-size="9.8" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">priced separately</text><g filter="url(#sh2)"><rect x="70" y="216" width="210" height="440" rx="26" fill="#17140F"/></g><rect x="79" y="225" width="192" height="422" rx="18" fill="#FFFFFF"/><rect x="153.0" y="231" width="44" height="5" rx="2.5" fill="#E7E2D8"/><rect x="79" y="225" width="192" height="422" rx="18" fill="#0E0E10"/><text x="95" y="265" font-size="14" fill="#F2F0EC" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">What&#x27;s on the car?</text><text x="95" y="283" font-size="9" fill="#8E8B85" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Tap what applies.</text><rect x="93" y="303" width="164" height="32" rx="9" fill="#231C08" stroke="#C98A00" stroke-width="1.2" /><rect x="103" y="312" width="14" height="14" rx="4" fill="#C98A00" stroke="#C98A00" stroke-width="1.6"/><path d="M106 319 l3 3 l5 -6" stroke="#17140F" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="125" y="324" font-size="9.6" fill="#EDEBE6" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Exhaust system</text><rect x="93" y="343" width="164" height="32" rx="9" fill="#231C08" stroke="#C98A00" stroke-width="1.2" /><rect x="103" y="352" width="14" height="14" rx="4" fill="#C98A00" stroke="#C98A00" stroke-width="1.6"/><path d="M106 359 l3 3 l5 -6" stroke="#17140F" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="125" y="364" font-size="9.6" fill="#EDEBE6" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Suspension / coilovers</text><rect x="93" y="383" width="164" height="32" rx="9" fill="#17171A" stroke="#2A2A2E" stroke-width="1.2" /><rect x="103" y="392" width="14" height="14" rx="4" fill="none" stroke="#45454A" stroke-width="1.6"/><text x="125" y="404" font-size="9.6" fill="#A8A5A0" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">ECU remap</text><rect x="93" y="423" width="164" height="32" rx="9" fill="#231C08" stroke="#C98A00" stroke-width="1.2" /><rect x="103" y="432" width="14" height="14" rx="4" fill="#C98A00" stroke="#C98A00" stroke-width="1.6"/><path d="M106 439 l3 3 l5 -6" stroke="#17140F" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="125" y="444" font-size="9.6" fill="#EDEBE6" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Wheels &amp; tyres</text><rect x="93" y="463" width="164" height="32" rx="9" fill="#17171A" stroke="#2A2A2E" stroke-width="1.2" /><rect x="103" y="472" width="14" height="14" rx="4" fill="none" stroke="#45454A" stroke-width="1.6"/><text x="125" y="484" font-size="9.6" fill="#A8A5A0" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Body kit</text><rect x="93" y="503" width="164" height="32" rx="9" fill="#17171A" stroke="#2A2A2E" stroke-width="1.2" /><rect x="103" y="512" width="14" height="14" rx="4" fill="none" stroke="#45454A" stroke-width="1.6"/><text x="125" y="524" font-size="9.6" fill="#A8A5A0" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Roll cage</text><rect x="93" y="543" width="164" height="32" rx="9" fill="#17171A" stroke="#2A2A2E" stroke-width="1.2" /><rect x="103" y="552" width="14" height="14" rx="4" fill="none" stroke="#45454A" stroke-width="1.6"/><text x="125" y="564" font-size="9.6" fill="#A8A5A0" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Turbo upgrade</text><rect x="93" y="591" width="164" height="36" rx="9" fill="#C98A00" stroke="none" stroke-width="0" /><text x="175.0" y="614" font-size="10" fill="#17140F" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">3 selected · continue</text><text x="70" y="680" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Step 2 — a picker, because</text><text x="70" y="694" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">owners could not spell what</text><text x="70" y="708" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">they had fitted.</text><g filter="url(#sh2)"><rect x="330" y="216" width="210" height="440" rx="26" fill="#17140F"/></g><rect x="339" y="225" width="192" height="422" rx="18" fill="#FFFFFF"/><rect x="413.0" y="231" width="44" height="5" rx="2.5" fill="#E7E2D8"/><rect x="339" y="225" width="192" height="422" rx="18" fill="#0E0E10"/><text x="355" y="265" font-size="14" fill="#F2F0EC" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Your quote</text><rect x="353" y="279" width="164" height="78" rx="12" fill="#231C08" stroke="#C98A00" stroke-width="1.4" /><text x="367" y="309" font-size="26" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">R1 184</text><text x="367" y="327" font-size="7.8" fill="#C9C2B0" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">per month · agreed value R385 000</text><text x="367" y="345" font-size="8.6" fill="#8FCFA8" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Mods covered: R48 000</text><text x="359" y="387" font-size="9.6" fill="#B7B3AC" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Vehicle cover</text><text x="511" y="387" font-size="9.6" fill="#EDEBE6" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">R 942</text><line x1="359" y1="395" x2="511" y2="395" stroke="#232326" stroke-width="1"/><text x="359" y="417" font-size="9.6" fill="#B7B3AC" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Declared mods</text><text x="511" y="417" font-size="9.6" fill="#EDEBE6" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">R 186</text><line x1="359" y1="425" x2="511" y2="425" stroke="#232326" stroke-width="1"/><text x="359" y="447" font-size="9.6" fill="#B7B3AC" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Track-day add-on</text><text x="511" y="447" font-size="9.6" fill="#EDEBE6" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">R 56</text><line x1="359" y1="455" x2="511" y2="455" stroke="#232326" stroke-width="1"/><text x="359" y="477" font-size="9.6" fill="#B7B3AC" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Excess R6 500</text><text x="511" y="477" font-size="9.6" fill="#EDEBE6" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">included</text><line x1="359" y1="485" x2="511" y2="485" stroke="#232326" stroke-width="1"/><rect x="353" y="507" width="164" height="54" rx="10" fill="#12211A" stroke="#2C5A44" stroke-width="1.2" /><text x="365" y="525" font-size="8.2" fill="#8FCFA8" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Declaring your mods saved you</text><text x="365" y="542" font-size="8.6" fill="#DCEFE4" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">R214 a month against an</text><text x="365" y="555" font-size="8.6" fill="#DCEFE4" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">undeclared policy.</text><rect x="353" y="573" width="164" height="36" rx="9" fill="#C98A00" stroke="none" stroke-width="0" /><text x="435.0" y="596" font-size="9.4" fill="#17140F" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Accept and upload photos</text><text x="330" y="680" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Step 4 — the number that made</text><text x="330" y="694" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">the strategy true, on screen.</text><rect x="600" y="216" width="552" height="440" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="622" y="246" font-size="14" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Four decisions and why</text><rect x="622" y="272" width="508" height="88" rx="11" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.2" /><rect x="622" y="272" width="4" height="88" rx="2" fill="#1F8A57"/><text x="640" y="296" font-size="11.8" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Reg lookup first</text><text x="640" y="316" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Nine fields disappear. Owners could not remember their engine</text><text x="640" y="329" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">code and would not go outside to check.</text><rect x="622" y="368" width="508" height="88" rx="11" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.2" /><rect x="622" y="368" width="4" height="88" rx="2" fill="#0C7FA8"/><text x="640" y="392" font-size="11.8" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Mods as a picker</text><text x="640" y="412" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Free text produced 340 spellings of “coilovers”. A picker made</text><text x="640" y="425" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">the data usable for underwriting too.</text><rect x="622" y="464" width="508" height="88" rx="11" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.2" /><rect x="622" y="464" width="4" height="88" rx="2" fill="#6A45C4"/><text x="640" y="488" font-size="11.8" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Agreed value shown next to market value</text><text x="640" y="508" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">The single biggest trust lever in testing. 9 of 11 chose</text><text x="640" y="521" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">agreed value once they could compare.</text><rect x="622" y="560" width="508" height="88" rx="11" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.2" /><rect x="622" y="560" width="4" height="88" rx="2" fill="#C98A00"/><text x="640" y="584" font-size="11.8" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Price the mods separately</text><text x="640" y="604" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">It proves the promise. Hiding it in one number made people</text><text x="640" y="617" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">assume they were being penalised.</text></svg>