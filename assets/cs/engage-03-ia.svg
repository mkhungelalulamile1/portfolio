lvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">TOBi, service desk, directory</text><text x="1110" y="282" font-size="20" fill="#7C7060" font-weight="700" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">›</text><rect x="674" y="322" width="456" height="62" rx="11" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.2" /><rect x="674" y="322" width="5" height="62" rx="2.5" fill="#6A45C4"/><text x="694" y="349" font-size="14" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Do</text><text x="694" y="368" font-size="10.5" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Leave, claims, IT requests</text><text x="1110" y="358" font-size="20" fill="#7C7060" font-weight="700" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">›</text><rect x="674" y="398" width="456" height="62" rx="11" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.2" /><rect x="674" y="398" width="5" height="62" rx="2.5" fill="#1F8A57"/><text x="694" y="425" font-size="14" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Me</text><text x="694" y="444" font-size="10.5" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Profile, documents, learning</text><text x="1110" y="434" font-size="20" fill="#7C7060" font-weight="700" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">›</text><rect x="674" y="482" width="456" height="66" rx="10" fill="#DAF0E5" stroke="#1F8A57" stroke-width="1.2" /><text x="690" y="506" font-size="11.5" fill="#1F8A57" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Tree test: 86% success · 19s median · 0.7 wrong turns</text><text x="690" y="526" font-size="10.5" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Named after the thing you came to do, in the words people used.</text><rect x="48" y="600" width="1104" height="62" rx="12" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1.4" /><text x="68" y="626" font-size="12" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Rule I held to</text><text x="196" y="626" font-size="11.5" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">If a label needs explaining during a tree test it is the wrong label. I change it, I do not defend it.</text><text x="68" y="648" font-size="10.5" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Tested twice: 31 employees round one, 27 round two, same tasks, same script.</text></svg>