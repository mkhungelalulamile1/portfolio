<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Bursary service blueprint</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="660" fill="#F3EEE4"/><rect width="1200" height="660" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Service blueprint — bursary application</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Drawn with the bursary office, the service desk and one student who had failed the process twice.</text><rect x="48" y="116" width="1104" height="416" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><rect x="48" y="116" width="1104" height="36" rx="12" fill="#F3EEE4"/><rect x="48" y="140" width="1104" height="12" fill="#F3EEE4"/><text x="261.0" y="138.0" font-size="9.5" fill="#7C7060" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1" opacity="1">HEARS ABOUT IT</text><text x="423.0" y="138.0" font-size="9.5" fill="#7C7060" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1" opacity="1">CHECKS IF ELIGIBLE</text><line x1="342.0" y1="116" x2="342.0" y2="532" stroke="#D9D1C2" stroke-width="1"/><text x="585.0" y="138.0" font-size="9.5" fill="#7C7060" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1" opacity="1">APPLIES</text><line x1="504.0" y1="116" x2="504.0" y2="532" stroke="#D9D1C2" stroke-width="1"/><text x="747.0" y="138.0" font-size="9.5" fill="#7C7060" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1" opacity="1">UPLOADS DOCUMENTS</text><line x1="666.0" y1="116" x2="666.0" y2="532" stroke="#D9D1C2" stroke-width="1"/><text x="909.0" y="138.0" font-size="9.5" fill="#7C7060" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1" opacity="1">WAITS</text><line x1="828.0" y1="116" x2="828.0" y2="532" stroke="#D9D1C2" stroke-width="1"/><text x="1071.0" y="138.0" font-size="9.5" fill="#7C7060" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1" opacity="1">OUTCOME</text><line x1="990.0" y1="116" x2="990.0" y2="532" stroke="#D9D1C2" stroke-width="1"/><line x1="180" y1="116" x2="180" y2="532" stroke="#D9D1C2" stroke-width="1.2"/><text x="62" y="194.0" font-size="10.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Student</text><text x="188.0" y="172.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Sees a poster, no link</text><text x="350.0" y="172.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Reads a 6-page PDF</text><text x="512.0" y="172.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">42 fields, one page</text><text x="674.0" y="172.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Scans at an internet café</text><text x="836.0" y="172.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">No status, phones</text><text x="998.0" y="172.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Email, no reason given</text><line x1="48" y1="228" x2="1152" y2="228" stroke="#D9D1C2" stroke-width="1"/><text x="62" y="270.0" font-size="10.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Frontstage</text><text x="188.0" y="248.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Poster + WhatsApp forward</text><text x="350.0" y="248.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">PDF on the intranet</text><text x="512.0" y="248.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Web form</text><text x="674.0" y="248.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Email attachment</text><text x="836.0" y="248.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Service desk queue</text><text x="998.0" y="248.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Bulk mail merge</text><line x1="48" y1="304" x2="1152" y2="304" stroke="#D9D1C2" stroke-width="1"/><text x="62" y="346.0" font-size="10.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Backstage</text><text x="188.0" y="324.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Comms schedules print</text><text x="350.0" y="324.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Policy owner updates PDF</text><text x="350.0" y="336.5" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">yearly</text><text x="512.0" y="324.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Form writes to a shared</text><text x="512.0" y="336.5" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">inbox</text><text x="674.0" y="324.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Admin renames files by</text><text x="674.0" y="336.5" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">hand</text><text x="836.0" y="324.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Admin answers by phone</text><text x="998.0" y="324.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Panel scores in a</text><text x="998.0" y="336.5" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">spreadsheet</text><line x1="48" y1="380" x2="1152" y2="380" stroke="#D9D1C2" stroke-width="1"/><text x="62" y="422.0" font-size="10.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Systems</text><text x="188.0" y="400.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">—</text><text x="350.0" y="400.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">SharePoint</text><text x="512.0" y="400.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Legacy form engine</text><text x="674.0" y="400.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Outlook + network drive</text><text x="836.0" y="400.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">No ticket type exists</text><text x="998.0" y="400.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Excel + mail merge</text><line x1="48" y1="456" x2="1152" y2="456" stroke="#D9D1C2" stroke-width="1"/><text x="62" y="498.0" font-size="10.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Fails</text><text x="188.0" y="476.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">No single link to share</text><text x="350.0" y="476.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Eligibility buried on p.4</text><text x="512.0" y="476.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">60% abandon here</text><text x="674.0" y="476.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Filenames lost</text><text x="836.0" y="476.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">31% call twice</text><text x="998.0" y="476.0" font-size="9.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">No feedback loop</text><line x1="48" y1="304" x2="1152" y2="304" stroke="#0C7FA8" stroke-width="1.6" stroke-dasharray="6 5"/><text x="1146" y="297" font-size="8.8" fill="#0C7FA8" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.6" opacity="1">line of visibility</text><rect x="48" y="456" width="1104" height="76" fill="#D2461A" opacity=".05"/><rect x="48" y="528" width="542" height="100" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="68" y="556" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Five failure points, one root cause</text><text x="68" y="578" font-size="11" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">The service assumed a laptop, a printer, uncapped data and patience.</text><text x="68" y="598" font-size="11" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">None of those were true for the students it was written for.</text><rect x="610" y="528" width="542" height="100" rx="12" fill="#DAF0E5" stroke="#1F8A57" stroke-width="1.4" /><text x="630" y="556" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">What I changed first</text><text x="630" y="578" font-size="11" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Not the form. The two moments around it: an assistant that can answer</text><text x="630" y="598" font-size="11" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“am I eligible?”, and a status the student can check without phoning.</text></svg>