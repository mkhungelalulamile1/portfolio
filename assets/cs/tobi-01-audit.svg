<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>TOBi conversation audit</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="700" fill="#F3EEE4"/><rect width="1200" height="700" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Conversation audit — what the bot actually did</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">3 400 transcripts read in a spreadsheet, tagged by intent and by outcome. Two weeks, no assumptions.</text><rect x="48" y="112" width="470" height="460" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="70" y="142" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">A real transcript, lightly redacted</text><rect x="276.0" y="166" width="216.0" height="34" rx="12" fill="#E8F3FF" stroke="#C9E0F5" stroke-width="1.2" /><text x="288.0" y="184" font-size="10.4" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">hi i need help with my bursary</text><rect x="70" y="210" width="262.8" height="34" rx="12" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.2" /><text x="82" y="228" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Hi! I&#x27;m TOBi. How can I help you today?</text><rect x="395.6" y="254" width="96.4" height="34" rx="12" fill="#E8F3FF" stroke="#C9E0F5" stroke-width="1.2" /><text x="407.6" y="272" font-size="10.4" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">bursary</text><rect x="70" y="298" width="330" height="48" rx="12" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.2" /><text x="82" y="316" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Sorry, I didn&#x27;t get that. You can ask me</text><text x="82" y="330" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">about airtime, data or billing.</text><rect x="333.2" y="356" width="158.8" height="34" rx="12" fill="#E8F3FF" stroke="#C9E0F5" stroke-width="1.2" /><text x="345.2" y="374" font-size="10.4" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">BURSARY APPLICATION</text><rect x="70" y="400" width="330" height="48" rx="12" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1.2" /><text x="82" y="418" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Sorry, I didn&#x27;t get that. Type &#x27;agent&#x27; to</text><text x="82" y="432" font-size="10.4" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">speak to someone.</text><rect x="406.0" y="458" width="86.0" height="34" rx="12" fill="#E8F3FF" stroke="#C9E0F5" stroke-width="1.2" /><text x="418.0" y="476" font-size="10.4" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">agent</text><rect x="70" y="506" width="426" height="52" rx="10" fill="#FBE1D6" stroke="#D2461A" stroke-width="1.2" /><text x="84" y="528" font-size="11.5" fill="#D2461A" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Six turns. Zero answers. One angry human.</text><text x="84" y="546" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">This shape appeared in 41% of the transcripts I read.</text><rect x="542" y="112" width="610" height="460" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="564" y="142" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Top intents vs. what the bot could answer</text><text x="564" y="160" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Volume over 30 days · green = handled, red = dead end</text><text x="564" y="198" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Bursary / application status</text><text x="1130" y="198" font-size="10.6" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">812</text><rect x="564" y="206" width="566" height="12" rx="6" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="564" y="206" width="566.0" height="12" rx="6" fill="#D2461A" stroke="none" stroke-width="0" /><text x="564" y="244" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Password + VPN reset</text><text x="1130" y="244" font-size="10.6" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">640</text><rect x="564" y="252" width="566" height="12" rx="6" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="564" y="252" width="446.10837438423647" height="12" rx="6" fill="#D2461A" stroke="none" stroke-width="0" /><rect x="564" y="252" width="156.13793103448276" height="12" rx="6" fill="#1F8A57" stroke="none" stroke-width="0" /><text x="564" y="290" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Payslip and tax certificate</text><text x="1130" y="290" font-size="10.6" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">505</text><rect x="564" y="298" width="566" height="12" rx="6" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="564" y="298" width="352.0073891625616" height="12" rx="6" fill="#D2461A" stroke="none" stroke-width="0" /><text x="564" y="336" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Leave balance</text><text x="1130" y="336" font-size="10.6" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">402</text><rect x="564" y="344" width="566" height="12" rx="6" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="564" y="344" width="280.2118226600985" height="12" rx="6" fill="#D2461A" stroke="none" stroke-width="0" /><rect x="564" y="344" width="154.1165024630542" height="12" rx="6" fill="#1F8A57" stroke="none" stroke-width="0" /><text x="564" y="382" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Laptop / hardware fault</text><text x="1130" y="382" font-size="10.6" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">361</text><rect x="564" y="390" width="566" height="12" rx="6" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="564" y="390" width="251.63300492610836" height="12" rx="6" fill="#D2461A" stroke="none" stroke-width="0" /><rect x="564" y="390" width="50.326600985221674" height="12" rx="6" fill="#1F8A57" stroke="none" stroke-width="0" /><text x="564" y="428" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Canteen + shuttle times</text><text x="1130" y="428" font-size="10.6" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">288</text><rect x="564" y="436" width="566" height="12" rx="6" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="564" y="436" width="200.74876847290642" height="12" rx="6" fill="#D2461A" stroke="none" stroke-width="0" /><rect x="564" y="436" width="200.74876847290642" height="12" rx="6" fill="#1F8A57" stroke="none" stroke-width="0" /><text x="564" y="474" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Data and airtime</text><text x="1130" y="474" font-size="10.6" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">244</text><rect x="564" y="482" width="566" height="12" rx="6" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="564" y="482" width="170.07881773399015" height="12" rx="6" fill="#D2461A" stroke="none" stroke-width="0" /><rect x="564" y="482" width="170.07881773399015" height="12" rx="6" fill="#1F8A57" stroke="none" stroke-width="0" /><text x="564" y="520" font-size="10.6" fill="#1A1208" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Everything else</text><text x="1130" y="520" font-size="10.6" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">148</text><rect x="564" y="528" width="566" height="12" rx="6" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1" /><rect x="564" y="528" width="103.16256157635468" height="12" rx="6" fill="#D2461A" stroke="none" stroke-width="0" /><rect x="564" y="528" width="10.316256157635468" height="12" rx="6" fill="#1F8A57" stroke="none" stroke-width="0" /><rect x="564" y="546" width="122.39999999999999" height="20" rx="10.0" fill="#DAF0E5" stroke="#1F8A57" stroke-width="1" /><text x="625.2" y="559.4" font-size="10" fill="#1F8A57" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Handled end-to-end</text><rect x="694.4" y="546" width="110.8" height="20" rx="10.0" fill="#FBE1D6" stroke="#D2461A" stroke-width="1" /><text x="749.8" y="559.4" font-size="10" fill="#D2461A" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Dead end → human</text><rect x="48" y="596" width="1104" height="68" rx="12" fill="#FCEFCB" stroke="#C98A00" stroke-width="1.4" /><text x="68" y="622" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">What the numbers said</text><text x="68" y="644" font-size="11.5" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">The two highest-volume intents had no coverage at all. Nobody had ever mapped intent volume against bot capability — so the roadmap was being written from opinion.</text></svg>