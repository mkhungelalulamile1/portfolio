<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>ServiceWaze performance budget and results</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="560" fill="#F3EEE4"/><rect width="1200" height="560" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">A budget, not a hope</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Set on day one, enforced in CI. The build fails if the main bundle crosses 180 KB gzipped.</text><rect x="48" y="112" width="540" height="260" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="70" y="142" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">JavaScript shipped, week by week</text><text x="70" y="160" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">gzipped, main entry point</text><path d="M90.0 316 L90.0 254.7 L184.0 240.6 L278.0 224.7 L372.0 212.5 L466.0 203.0 L560.0 206.8 L560.0 316 Z" fill="#C98A00" opacity=".10"/><path d="M90.0 254.6882829771555 C137.0 254.6882829771555 137.0 240.63768115942028 184.0 240.63768115942028 C231.0 240.63768115942028 231.0 224.67108818472119 278.0 224.67108818472119 C325.0 224.67108818472119 325.0 212.53647752394988 372.0 212.53647752394988 C419.0 212.53647752394988 419.0 202.95652173913044 466.0 202.95652173913044 C513.0 202.95652173913044 513.0 206.7885040530582 560.0 206.7885040530582" stroke="#C98A00" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90.0" cy="254.7" r="3.6" fill="#FBF7EF" stroke="#C98A00" stroke-width="2.2"/><circle cx="184.0" cy="240.6" r="3.6" fill="#FBF7EF" stroke="#C98A00" stroke-width="2.2"/><circle cx="278.0" cy="224.7" r="3.6" fill="#FBF7EF" stroke="#C98A00" stroke-width="2.2"/><circle cx="372.0" cy="212.5" r="3.6" fill="#FBF7EF" stroke="#C98A00" stroke-width="2.2"/><circle cx="466.0" cy="203.0" r="3.6" fill="#FBF7EF" stroke="#C98A00" stroke-width="2.2"/><circle cx="560.0" cy="206.8" r="3.6" fill="#FBF7EF" stroke="#C98A00" stroke-width="2.2"/><text x="90.0" y="332" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">w1</text><text x="184.0" y="332" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">w3</text><text x="278.0" y="332" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">w5</text><text x="372.0" y="332" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">w7</text><text x="466.0" y="332" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">w9</text><text x="560.0" y="332" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">ship</text><line x1="90" y1="201" x2="560" y2="201" stroke="#D2461A" stroke-width="1.6" stroke-dasharray="6 4"/><text x="90" y="193.04053058216653" font-size="9.4" fill="#D2461A" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">budget · 180 KB gzipped</text><text x="70" y="352" font-size="10.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Two features were cut at week 9 rather than raise the number.</text><rect x="604" y="112" width="548" height="260" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="626" y="142" font-size="12.5" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Lighthouse, mid-range Android on throttled 3G</text><text x="626" y="160" font-size="10" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">median of 5 runs, production build</text><circle cx="690" cy="250" r="40" fill="none" stroke="#D9D1C2" stroke-width="8"/><circle cx="690" cy="250" r="40" fill="none" stroke="#1F8A57" stroke-width="8" stroke-linecap="round" stroke-dasharray="241.3 251.3" transform="rotate(-90 690 250)"/><text x="690" y="257" font-size="22" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">96</text><text x="690" y="310" font-size="10" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Performance</text><circle cx="820" cy="250" r="40" fill="none" stroke="#D9D1C2" stroke-width="8"/><circle cx="820" cy="250" r="40" fill="none" stroke="#1F8A57" stroke-width="8" stroke-linecap="round" stroke-dasharray="251.3 251.3" transform="rotate(-90 820 250)"/><text x="820" y="257" font-size="22" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">100</text><text x="820" y="310" font-size="10" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Accessibility</text><circle cx="950" cy="250" r="40" fill="none" stroke="#D9D1C2" stroke-width="8"/><circle cx="950" cy="250" r="40" fill="none" stroke="#1F8A57" stroke-width="8" stroke-linecap="round" stroke-dasharray="251.3 251.3" transform="rotate(-90 950 250)"/><text x="950" y="257" font-size="22" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">100</text><text x="950" y="310" font-size="10" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Best practices</text><circle cx="1080" cy="250" r="40" fill="none" stroke="#D9D1C2" stroke-width="8"/><circle cx="1080" cy="250" r="40" fill="none" stroke="#1F8A57" stroke-width="8" stroke-linecap="round" stroke-dasharray="251.3 251.3" transform="rotate(-90 1080 250)"/><text x="1080" y="257" font-size="22" fill="#1A1208" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">100</text><text x="1080" y="310" font-size="10" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">SEO</text><rect x="48" y="396" width="170" height="66" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="133.0" y="431.0" font-size="26" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">1.2s</text><text x="133.0" y="450" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">First contentful paint</text><rect x="234" y="396" width="170" height="66" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="319.0" y="431.0" font-size="26" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">1.9s</text><text x="319.0" y="450" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Largest contentful paint</text><rect x="420" y="396" width="170" height="66" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="505.0" y="431.0" font-size="26" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">0.01</text><text x="505.0" y="450" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Cumulative layout shift</text><rect x="606" y="396" width="170" height="66" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="691.0" y="431.0" font-size="26" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">48ms</text><text x="691.0" y="450" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Interaction to next paint</text><rect x="792" y="396" width="170" height="66" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="877.0" y="431.0" font-size="26" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">171 KB</text><text x="877.0" y="450" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">JS gzipped</text><rect x="978" y="396" width="170" height="66" rx="12" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="1063.0" y="431.0" font-size="26" fill="#C98A00" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">0</text><text x="1063.0" y="450" font-size="9.5" fill="#7C7060" font-weight="700" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Blocking third-party scripts</text><rect x="48" y="478" width="1104" height="62" rx="12" fill="#F3EEE4" stroke="#D9D1C2" stroke-width="1.4" /><text x="70" y="504" font-size="12" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">How it is kept</text><text x="70" y="526" font-size="11.2" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">GitHub Action runs Lighthouse CI and size-limit on every pull request. A regression is a red check, not a conversation three months later.</text></svg>