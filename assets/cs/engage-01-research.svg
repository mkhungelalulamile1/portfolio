<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 716" width="1200" height="716" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Engage affinity wall</title><desc>Four clusters of interview quotes: findability, split systems, connectivity and trust.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="716" fill="#F3EEE4"/><rect width="1200" height="716" fill="url(#dots)"/><text x="48" y="54" font-size="24" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Discovery — affinity wall</text><text x="48" y="78" font-size="12.5" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">14 interviews · 6 shadowing sessions · 2 041 support tickets tagged · 31 days</text><rect x="48" y="96" width="163.0" height="20" rx="10.0" fill="#F3EEE4" stroke="#C3B9A6" stroke-width="1" /><text x="129.5" y="109.4" font-size="10" fill="#7C7060" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Vodacom Engage · week 1–4</text><rect x="48" y="140" width="272" height="448" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><rect x="48" y="140" width="272" height="40" rx="14" fill="#FBE1D6" stroke="none" stroke-width="0" /><rect x="48" y="166" width="272" height="14" fill="#FBE1D6"/><text x="64" y="165" font-size="11" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.8" opacity="1">CANNOT FIND IT</text><text x="304" y="165" font-size="10" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">31 notes</text><g transform="rotate(1.2 184.0 248.0)"><rect x="62" y="196" width="244" height="104" rx="3" fill="#FFD3C2" filter="url(#sh)"/><text x="72" y="216.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“I know the leave form</text><text x="72" y="230.5" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">exists. I just never know</text><text x="72" y="245.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">where.”</text></g><g transform="rotate(-1.4 184.0 364.0)"><rect x="62" y="312" width="244" height="104" rx="3" fill="#FFD3C2" filter="url(#sh)"/><text x="72" y="332.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“I use the search box</text><text x="72" y="346.5" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">because the menu lies to</text><text x="72" y="361.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">me.”</text></g><g transform="rotate(1.2 184.0 480.0)"><rect x="62" y="428" width="244" height="104" rx="3" fill="#FFD3C2" filter="url(#sh)"/><text x="72" y="448.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“Eleven tiles and none of</text><text x="72" y="462.5" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">them say payslip.”</text></g><line x1="62" y1="548" x2="306" y2="548" stroke="#D9D1C2" stroke-width="1"/><text x="64" y="570" font-size="10" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">→ design principle 01</text><rect x="336" y="140" width="272" height="448" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><rect x="336" y="140" width="272" height="40" rx="14" fill="#D8EEF6" stroke="none" stroke-width="0" /><rect x="336" y="166" width="272" height="14" fill="#D8EEF6"/><text x="352" y="165" font-size="11" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.8" opacity="1">TWO APPS, ONE JOB</text><text x="592" y="165" font-size="10" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">22 notes</text><g transform="rotate(1.2 472.0 248.0)"><rect x="350" y="196" width="244" height="104" rx="3" fill="#CFE9FF" filter="url(#sh)"/><text x="360" y="216.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“Half of HR is in the app,</text><text x="360" y="230.5" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">half is on the intranet.”</text></g><g transform="rotate(-1.4 472.0 364.0)"><rect x="350" y="312" width="244" height="104" rx="3" fill="#CFE9FF" filter="url(#sh)"/><text x="360" y="332.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“I screenshot the canteen</text><text x="360" y="346.5" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">menu because it loads once</text><text x="360" y="361.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">a day.”</text></g><g transform="rotate(1.2 472.0 480.0)"><rect x="350" y="428" width="244" height="104" rx="3" fill="#CFE9FF" filter="url(#sh)"/><text x="360" y="448.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“Manager approvals only</text><text x="360" y="462.5" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">work on desktop.”</text></g><line x1="350" y1="548" x2="594" y2="548" stroke="#D9D1C2" stroke-width="1"/><text x="352" y="570" font-size="10" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">→ design principle 02</text><rect x="624" y="140" width="272" height="448" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><rect x="624" y="140" width="272" height="40" rx="14" fill="#FCEFCB" stroke="none" stroke-width="0" /><rect x="624" y="166" width="272" height="14" fill="#FCEFCB"/><text x="640" y="165" font-size="11" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.8" opacity="1">THE 4-BAR PROBLEM</text><text x="880" y="165" font-size="10" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">26 notes</text><g transform="rotate(1.2 760.0 248.0)"><rect x="638" y="196" width="244" height="104" rx="3" fill="#FFE49A" filter="url(#sh)"/><text x="648" y="216.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“In the basement it just</text><text x="648" y="230.5" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">spins forever.”</text></g><g transform="rotate(-1.4 760.0 364.0)"><rect x="638" y="312" width="244" height="104" rx="3" fill="#FFE49A" filter="url(#sh)"/><text x="648" y="332.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“If it fails I stop trying.</text><text x="648" y="346.5" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">I phone the service desk.”</text></g><g transform="rotate(1.2 760.0 480.0)"><rect x="638" y="428" width="244" height="104" rx="3" fill="#FFE49A" filter="url(#sh)"/><text x="648" y="448.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“Data is expensive. I only</text><text x="648" y="462.5" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">open it on Wi-Fi.”</text></g><line x1="638" y1="548" x2="882" y2="548" stroke="#D9D1C2" stroke-width="1"/><text x="640" y="570" font-size="10" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">→ design principle 03</text><rect x="912" y="140" width="272" height="448" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><rect x="912" y="140" width="272" height="40" rx="14" fill="#DAF0E5" stroke="none" stroke-width="0" /><rect x="912" y="166" width="272" height="14" fill="#DAF0E5"/><text x="928" y="165" font-size="11" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.8" opacity="1">NOBODY TRUSTS IT</text><text x="1168" y="165" font-size="10" fill="#7C7060" font-weight="800" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">18 notes</text><g transform="rotate(1.2 1048.0 248.0)"><rect x="926" y="196" width="244" height="104" rx="3" fill="#D9F5DE" filter="url(#sh)"/><text x="936" y="216.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“It said submitted. HR</text><text x="936" y="230.5" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">never got it.”</text></g><g transform="rotate(-1.4 1048.0 364.0)"><rect x="926" y="312" width="244" height="104" rx="3" fill="#D9F5DE" filter="url(#sh)"/><text x="936" y="332.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“There is no way to see</text><text x="936" y="346.5" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">where my request is.”</text></g><g transform="rotate(1.2 1048.0 480.0)"><rect x="926" y="428" width="244" height="104" rx="3" fill="#D9F5DE" filter="url(#sh)"/><text x="936" y="448.0" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“I ask my colleague instead</text><text x="936" y="462.5" font-size="10.5" fill="#1A1208" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">of the app.”</text></g><line x1="926" y1="548" x2="1170" y2="548" stroke="#D9D1C2" stroke-width="1"/><text x="928" y="570" font-size="10" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">→ design principle 04</text><rect x="48" y="616" width="1104" height="76" rx="14" fill="#FBF7EF" stroke="#D9D1C2" stroke-width="1.4" /><text x="68" y="652" font-size="22" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">14</text><text x="68" y="672" font-size="10" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">employee interviews</text><text x="250" y="652" font-size="22" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">6</text><text x="250" y="672" font-size="10" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">site shadowing</text><line x1="226" y1="634" x2="226" y2="674" stroke="#D9D1C2" stroke-width="1"/><text x="432" y="652" font-size="22" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">2 041</text><text x="432" y="672" font-size="10" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">tickets tagged</text><line x1="408" y1="634" x2="408" y2="674" stroke="#D9D1C2" stroke-width="1"/><text x="614" y="652" font-size="22" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">48s</text><text x="614" y="672" font-size="10" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">median time to task</text><line x1="590" y1="634" x2="590" y2="674" stroke="#D9D1C2" stroke-width="1"/><text x="796" y="652" font-size="22" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">11</text><text x="796" y="672" font-size="10" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">top-level destinations</text><line x1="772" y1="634" x2="772" y2="674" stroke="#D9D1C2" stroke-width="1"/><text x="978" y="652" font-size="22" fill="#C98A00" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">31%</text><text x="978" y="672" font-size="10" fill="#7C7060" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">gave up, phoned</text><line x1="954" y1="634" x2="954" y2="674" stroke="#D9D1C2" stroke-width="1"/></svg>