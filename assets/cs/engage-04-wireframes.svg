<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Engage lo-fi wireframes with test annotations</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D1C2" opacity=".55"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1208" flood-opacity=".10"/></filter><filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1208" flood-opacity=".14"/></filter></defs><rect width="1200" height="700" fill="#F3EEE4"/><rect width="1200" height="700" fill="url(#dots)"/><text x="48" y="52" font-size="23" fill="#1A1208" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Lo-fi wireframes — tested flat before any pixels</text><text x="48" y="76" font-size="12" fill="#7C7060" font-weight="600" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Greyscale on purpose. Five employees, printed screens, one task each. Round 1 of 3.</text><text x="48" y="118" font-size="10.5" fill="#7C7060" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1" opacity="1">01 · Today</text><rect x="48" y="128" width="250" height="420" rx="14" fill="#FBF7EF" stroke="#C3B9A6" stroke-width="1.4" /><rect x="64" y="146" width="218" height="26" rx="13.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="64" y="186" width="179.9" height="12" rx="6.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="64" y="214" width="218" height="84" rx="8" fill="#EFEAE0" stroke="#C3B9A6" stroke-width="1.2" /><rect x="76" y="230" width="120" height="10" rx="5.0" fill="#C3B9A6" stroke