ircle cx="652" cy="518" r="9" fill="#C3B9A6" opacity="0.6"/><circle cx="710" cy="518" r="9" fill="#C3B9A6" opacity="0.6"/><circle cx="768" cy="518" r="9" fill="#C98A00" opacity="1"/><circle cx="826" cy="518" r="9" fill="#C3B9A6" opacity="0.6"/><text x="894" y="118" font-size="10.5" fill="#7C7060" font-weight="800" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="1" opacity="1">04 · Status</text><rect x="894" y="128" width="250" height="420" rx="14" fill="#FBF7EF" stroke="#C3B9A6" stroke-width="1.4" /><rect x="910" y="146" width="218" height="26" rx="13.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="910" y="186" width="158.10000000000002" height="12" rx="6.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><circle cx="924" cy="230" r="7" fill="#C98A00"/><line x1="924" y1="237" x2="924" y2="261" stroke="#C3B9A6" stroke-width="2"/><rect x="942" y="225" width="150" height="10" rx="5.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><circle cx="924" cy="268" r="7" fill="#C98A00"/><line x1="924" y1="275" x2="924" y2="299" stroke="#C3B9A6" stroke-width="2"/><rect x="942" y="263" width="150" height="10" rx="5.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><circle cx="924" cy="306" r="7" fill="#C3B9A6"/><line x1="924" y1="313" x2="924" y2="337" stroke="#C3B9A6" stroke-width="2"/><rect x="942" y="301" width="150" height="10" rx="5.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><circle cx="924" cy="344" r="7" fill="#C3B9A6"/><rect x="942" y="339" width="150" height="10" rx="5.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="910" y="374" width="218" height="84" rx="8" fill="#EFEAE0" stroke="#C3B9A6" stroke-width="1.2" /><rect x="922" y="390" width="120" height="10" rx="5.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="922" y="408" width="170" height="10" rx="5.0" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".45"/><rect x="922" y="430" width="68" height="16" rx="7" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".85"/><rect x="910" y="474" width="218" height="38" rx="7" fill="#C3B9A6" stroke="none" stroke-width="0" opacity=".85"/><line x1="894" y1="492" x2="1144" y2="492" stroke="#D9D1C2" stroke-width="1.2"/><circle cx="934" cy="518" r="9" fill="#C3B9A6" opacity="0.6"/><circle cx="992" cy="518" r="9" fill="#C3B9A6" opacity="0.6"/><circle cx="1050" cy="518" r="9" fill="#C3B9A6" opacity="0.6"/><circle cx="1108" cy="518" r="9" fill="#C98A00" opacity="1"/><circle cx="57" cy="588" r="9" fill="#D2461A"/><text x="57" y="591.6" font-size="10" fill="#FFF" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">1</text><text x="72" y="592.0" font-size="10.5" fill="#D2461A" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Round 1: “Today” was called “Home”. Nobody expected their</text><text x="72" y="605.5" font-size="10.5" fill="#D2461A" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">shift on it. Renamed and moved the shift card to the top.</text><circle cx="629" cy="588" r="9" fill="#D2461A"/><text x="629" y="591.6" font-size="10" fill="#FFF" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">2</text><text x="644" y="592.0" font-size="10.5" fill="#D2461A" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Round 2: the request form lost 3 fields we could infer from</text><text x="644" y="605.5" font-size="10.5" fill="#D2461A" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">the staff number. Completion went from 4 of 5 to 5 of 5.</text><circle cx="57" cy="640" r="9" fill="#D2461A"/><text x="57" y="643.6" font-size="10" fill="#FFF" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">3</text><text x="72" y="644.0" font-size="10.5" fill="#D2461A" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Round 3: status timeline added after every participant asked</text><text x="72" y="657.5" font-size="10.5" fill="#D2461A" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">“did it go through?” unprompted.</text><circle cx="629" cy="640" r="9" fill="#D2461A"/><text x="629" y="643.6" font-size="10" fill="#FFF" font-weight="800" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">4</text><text x="644" y="644.0" font-size="10.5" fill="#D2461A" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">Only what survived three rounds got drawn in colour. Two ideas</text><text x="644" y="657.5" font-size="10.5" fill="#D2461A" font-weight="700" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0" opacity="1">died here — a chat tab and a news feed.</text></svg>