      <stop offset="0%" stop-color="#120e0a"/>
      <stop offset="100%" stop-color="#0A0705"/>
    </linearGradient>
  </defs>
  <rect width="300" height="520" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="298" height="518" rx="27" fill="none" stroke="rgba(240,165,0,0.25)"/>
  
  <!-- Status bar -->
  <text x="28" y="36" fill="rgba(245,237,216,0.5)" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600">09:41</text>
  <circle cx="250" cy="32" r="3" fill="#1DB954"/>
  <circle cx="262" cy="32" r="3" fill="rgba(245,237,216,0.35)"/>
  <circle cx="274" cy="32" r="3" fill="rgba(245,237,216,0.35)"/>

