  <text x="94" y="80" text-anchor="middle" fill="#00C2FF" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="800" letter-spacing="1">RETAIL KIOSK UI</text>

  <!-- Title & Sub -->
  <text x="24" y="105" fill="#F5EDD8" font-family="Bebas Neue,Arial Black,sans-serif" font-size="24" font-weight="900" letter-spacing="1">TYME KIOSK 2.0</text>
  <text x="24" y="122" fill="rgba(245,237,216,0.6)" font-family="Inter,Arial,sans-serif" font-size="11">In-store card print · Pick n Pay / Boxer</text>

  
  <!-- Step Progress -->
  <rect x="24" y="135" width="60" height="6" rx="3" fill="#00C2FF"/>
  <rect x="90" y="135" width="60" height="6" rx="3" fill="#00C2FF"/>
  <rect x="156" y="135" width="60" height="6" rx="3" fill="#00C2FF"/>
  <rect x="222" y="135" width="54" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>

  <!-- Screen Illustration -->
  <rect x="24" y="155" width="252" height="150" rx="16" fill="#151921" stroke="rgba(0,194,255,0.4)"/>
  <circle cx="150" cy="205" r="32" fill="rgba(0,194,255,0.15)" stroke="#00C2FF" stroke-width="2"/>
  <!-- Fingerprint icon graphic -->
  <path d="M140 205 Q150 190 160 205" stroke="#00C2FF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M135 212 Q150 197 165 212" stroke="#00C2FF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="150" y="260" text-anchor="middle" fill="#F5EDD8" font-family="Inter,sans-serif" font-size="14" font-weight="800">FICA BIOMETRIC VERIFY</text>
