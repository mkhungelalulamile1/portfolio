  <!-- Card preview box -->
  <rect x="24" y="320" width="252" height="95" rx="14" fill="#1C1814" stroke="rgba(255,255,255,0.1)"/>
  <text x="40" y="345" fill="rgba(245,237,216,0.5)" font-family="Inter,sans-serif" font-size="10" font-weight="700">PRINTING YOUR VISA DEBIT</text>
  <text x="40" y="370" fill="#F5EDD8" font-family="Inter,sans-serif" font-size="16" font-weight="800">•••• •••• •••• 9410</text>
  <text x="40" y="395" fill="#00C2FF" font-family="Inter,sans-serif" font-size="11" font-weight="700">✓ Ready in 45 seconds · Zero monthly fees</text>

  <!-- Action button -->
