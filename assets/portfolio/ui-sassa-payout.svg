<svg xmlns="http://www.w3.org/2000/svg" width="300" height="520" viewBox="0 0 300 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120e0a"/>
      <stop offset="100%" stop-color="#0A0705"/>
    </linearGradient>
  </defs>
  <rect width="300" height="520" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="298" height="518" rx="27" fill="none" stroke="rgba(240,165,0,0.25)"/>
  
  <!-- Status bar -->
  <text x="28" y="36" fill="rgba(245,237,216,0.5)" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600">09:41</text>
  <circle cx="250" cy="32" r="3" fill="#1DB954"/>
  <circle cx="262" cy="32" r="3" fill="rgba(245,237,216,0.35)"/>
  <circle cx="274" cy="32" r="3" fill="rgba(245,237,216,0.35)"/>

  <!-- Pill Tag -->
  <rect x="24" y="65" width="140" height="22" rx="11" fill="#4ADE80" opacity="0.15" stroke="#4ADE80" stroke-opacity="0.5"/>
  <text x="94" y="80" text-anchor="middle" fill="#4ADE80" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="800" letter-spacing="1">SOCIAL IMPACT FINTECH</text>

  <!-- Title & Sub -->
  <text x="24" y="105" fill="#F5EDD8" font-family="Bebas Neue,Arial Black,sans-serif" font-size="24" font-weight="900" letter-spacing="1">SASSA SRD VOUCHER</text>
  <text x="24" y="122" fill="rgba(245,237,216,0.6)" font-family="Inter,Arial,sans-serif" font-size="11">Biometric grant QR & retail grocer redemption</text>

  
  <!-- Grant balance card -->
  <rect x="24" y="135" width="252" height="95" rx="16" fill="#131C16" stroke="rgba(74,222,128,0.4)"/>
  <text x="40" y="160" fill="rgba(245,237,216,0.6)" font-family="Inter,sans-serif" font-size="10" font-weight="700">SASSA SRD GRANT WALLET</text>
  <text x="40" y="190" fill="#FFFFFF" font-family="Inter,sans-serif" font-size="26" font-weight="900">R 370.00</text>
  <text x="40" y="214" fill="#4ADE80" font-family="Inter,sans-serif" font-size="11" font-weight="700">✓ July 2026 Disbursed · No Queue Needed</text>

  <!-- Voucher QR Barcode area -->
  <rect x="24" y="245" width="252" height="110" rx="14" fill="#FFFFFF"/>
  <rect x="40" y="265" width="60" height="60" rx="6" fill="#0A0705"/>
  <rect x="52" y="277" width="36" height="36" rx="4" fill="#FFFFFF"/>
  <rect x="62" y="287" width="16" height="16" fill="#4ADE80"/>
  <text x="115" y="285" fill="#0A0705" font-family="Inter,sans-serif" font-size="14" font-weight="900">BOXER / SHOPRITE</text>
  <text x="115" y="305" fill="#444444" font-family="Inter,sans-serif" font-size="11" font-weight="700">Voucher PIN: 884-219</text>
  <text x="115" y="325" fill="#1DB954" font-family="Inter,sans-serif" font-size="11" font-weight="800">Tap or scan at cashier</text>

  <!-- Multi-language support tag -->
  <rect x="24" y="370" width="252" height="60" rx="12" fill="#161A16" stroke="rgba(255,255,255,0.08)"/>
  <text x="40" y="394" fill="#F5EDD8" font-family="Inter,sans-serif" font-size="12" font-weight="700">4 SA Languages Supported</text>
  <text x="40" y="415" fill="rgba(245,237,216,0.6)" font-family="Inter,sans-serif" font-size="11">isiZulu · isiXhosa · Sepedi · English · *134*77#</text>

  <rect x="24" y="445" width="252" height="48" rx="12" fill="#4ADE80"/>
  <text x="150" y="474" text-anchor="middle" fill="#0A0705" font-family="Inter,sans-serif" font-size="13" font-weight="800">REDEEM VOUCHER INSTANTLY</text>

</svg>