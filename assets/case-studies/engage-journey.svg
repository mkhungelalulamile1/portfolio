<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Current-state journey map: “I need my payslip and a boardroom”">
<rect width="1240" height="660" fill="#F7F4EC"/>
<rect x="0" y="0" width="1240" height="6" fill="#B57200"/>
<text x="34" y="46" font-size="20" font-weight="bold" fill="#1A1208">Current-state journey map: “I need my payslip and a boardroom”</text>
<text x="34" y="68" font-size="13" fill="#6B6055">Vodacom Engage · 6 contextual interviews and 3 shadowing sessions, Midrand and Century City</text>
<text x="36" y="116" font-size="10" font-weight="bold" fill="#6B6055" text-anchor="start">STAGE</text>
<text x="36" y="176" font-size="10" font-weight="bold" fill="#6B6055" text-anchor="start">DOING</text>
<text x="36" y="334" font-size="10" font-weight="bold" fill="#6B6055" text-anchor="start">FEELING</text>
<text x="36" y="452" font-size="10" font-weight="bold" fill="#6B6055" text-anchor="start">SAYING</text>
<line x1="110" y1="330" x2="1200" y2="330" stroke="#D9D0BE" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M 194 267 L 372 318 L 550 382 L 728 428 L 906 370 L 1084 313" fill="none" stroke="#C03A08" stroke-width="3" stroke-linecap="round"/>
<circle cx="194" cy="267" r="8" fill="#F7F4EC" stroke="#C03A08" stroke-width="3"/>
<text x="194" y="250.75" font-size="9.5" font-weight="bold" fill="#6B6055" text-anchor="middle">positive</text>
<circle cx="372" cy="318" r="8" fill="#F7F4EC" stroke="#C03A08" stroke-width="3"/>
<text x="372" y="302.5" font-size="9.5" font-weight="bold" fill="#6B6055" text-anchor="middle">neutral</text>
<circle cx="550" cy="382" r="8" fill="#F7F4EC" stroke="#C03A08" stroke-width="3"/>
<text x="550" y="405.75" font-size="9.5" font-weight="bold" fill="#6B6055" text-anchor="middle">frustrated</text>
<circle cx="728" cy="428" r="8" fill="#F7F4EC" stroke="#C03A08" stroke-width="3"/>
<text x="728" y="451.75" font-size="9.5" font-weight="bold" fill="#6B6055" text-anchor="middle">frustrated</text>
<circle cx="906" cy="370" r="8" fill="#F7F4EC" stroke="#C03A08" stroke-width="3"/>
<text x="906" y="394.25" font-size="9.5" font-weight="bold" fill="#6B6055" text-anchor="middle">frustrated</text>
<circle cx="1084" cy="313" r="8" fill="#F7F4EC" stroke="#C03A08" stroke-width="3"/>
<text x="1084" y="296.75" font-size="9.5" font-weight="bold" fill="#6B6055" text-anchor="middle">neutral</text>
<text x="194" y="116" font-size="13" font-weight="bold" fill="#B57200" text-anchor="middle">01</text>
<text x="194" y="136" font-size="12" font-weight="bold" fill="#1A1208" text-anchor="middle">Open app</text>
<text x="132" y="176" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">Taps Engage from the home</text>
<text x="132" y="189" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">screen</text>
<rect x="132" y="440" width="150" height="66" rx="8" fill="#FFFFFF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="143" y="462" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">“Quick one before</text>
<text x="143" y="476" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">standup.”</text>
<text x="372" y="116" font-size="13" font-weight="bold" fill="#B57200" text-anchor="middle">02</text>
<text x="372" y="136" font-size="12" font-weight="bold" fill="#1A1208" text-anchor="middle">Hunt the tile</text>
<text x="310" y="176" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">Scans 11 red tiles, twice</text>
<rect x="310" y="440" width="150" height="66" rx="8" fill="#FFFFFF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="321" y="462" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">“Which one is payslip</text>
<text x="321" y="476" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">again?”</text>
<text x="550" y="116" font-size="13" font-weight="bold" fill="#B57200" text-anchor="middle">03</text>
<text x="550" y="136" font-size="12" font-weight="bold" fill="#1A1208" text-anchor="middle">Log in again</text>
<text x="488" y="176" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">Session expired after 15</text>
<text x="488" y="189" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">minutes</text>
<rect x="488" y="440" width="150" height="66" rx="8" fill="#FFFFFF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="499" y="462" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">“Why does it log me</text>
<text x="499" y="476" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">out?”</text>
<text x="728" y="116" font-size="13" font-weight="bold" fill="#B57200" text-anchor="middle">04</text>
<text x="728" y="136" font-size="12" font-weight="bold" fill="#1A1208" text-anchor="middle">Give up on app</text>
<text x="666" y="176" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">Closes app and opens the</text>
<text x="666" y="189" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">laptop</text>
<rect x="666" y="440" width="150" height="66" rx="8" fill="#FFFFFF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="677" y="462" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">“It is faster on the</text>
<text x="677" y="476" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">laptop.”</text>
<text x="906" y="116" font-size="13" font-weight="bold" fill="#B57200" text-anchor="middle">05</text>
<text x="906" y="136" font-size="12" font-weight="bold" fill="#1A1208" text-anchor="middle">Ask a colleague</text>
<text x="844" y="176" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">Messages team lead for</text>
<text x="844" y="189" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">the link</text>
<rect x="844" y="440" width="150" height="66" rx="8" fill="#FFFFFF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="855" y="462" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">“Someone always has the</text>
<text x="855" y="476" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">link.”</text>
<text x="1084" y="116" font-size="13" font-weight="bold" fill="#B57200" text-anchor="middle">06</text>
<text x="1084" y="136" font-size="12" font-weight="bold" fill="#1A1208" text-anchor="middle">Use desktop portal</text>
<text x="1022" y="176" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">Finds payslip in 40</text>
<text x="1022" y="189" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">seconds</text>
<rect x="1022" y="440" width="150" height="66" rx="8" fill="#FFFFFF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="1033" y="462" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">“This is where I</text>
<text x="1033" y="476" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">actually work.”</text>
<rect x="34" y="530" width="1172" height="80" rx="8" fill="#FFF6E6" stroke="#B57200" stroke-width="1.5"/>
<text x="52" y="556" font-size="12" font-weight="bold" fill="#1A1208" text-anchor="start">OPPORTUNITY — people did not fail at the task. They failed at finding it and at staying signed in.</text>
<text x="52" y="580" font-size="11" font-weight="normal" fill="#6B6055" text-anchor="start">Design bets: 1) search on the home screen  2) 30-day biometric session  3) group tiles by task  4) let people pin their own four favourites.</text>
<text x="34" y="642" font-size="11" fill="#6B6055">Lulamile Mkhungela · LulaSync — working artifact from the project</text>
</svg>
