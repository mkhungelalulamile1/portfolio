<text x="482" y="319" font-size="10.5" font-weight="bold" fill="#1A1208" text-anchor="middle">Gift &amp; Hospitality</text>
<rect x="58" y="356" width="160" height="56" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="138" y="389" font-size="10.5" font-weight="bold" fill="#1A1208" text-anchor="middle">Payslip (web only)</text>
<rect x="230" y="356" width="160" height="56" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="310" y="389" font-size="10.5" font-weight="bold" fill="#1A1208" text-anchor="middle">Leave (web only)</text>
<text x="58" y="462" font-size="12" font-weight="bold" fill="#1A1208" text-anchor="start">What the research showed (card sort, n=18):</text>
<text x="58" y="488" font-size="11" font-weight="normal" fill="#6B6055" text-anchor="start">•  Tiles were ordered by launch date, not by use.</text>
<text x="58" y="512" font-size="11" font-weight="normal" fill="#6B6055" text-anchor="start">•  People scanned all 11 tiles on every visit.</text>
<text x="58" y="536" font-size="11" font-weight="normal" fill="#6B6055" text-anchor="start">•  No search, so the top 4 tasks lived off the app.</text>
<text x="58" y="560" font-size="11" font-weight="normal" fill="#6B6055" text-anchor="start">•  The label “askIT” was understood by 5 of 18 people.</text>
<text x="58" y="584" font-size="11" font-weight="normal" fill="#6B6055" text-anchor="start">•  Payslip and leave were not in the app at all.</text>
<rect x="58" y="620" width="500" height="44" rx="8" fill="#FDECE6" stroke="#C03A08" stroke-width="1.5"/>
<text x="74" y="648" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">Average time to first task: 48 seconds (unmoderated, n=12)</text>
