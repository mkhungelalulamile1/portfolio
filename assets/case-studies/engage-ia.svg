<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Information architecture: before vs after">
<rect width="1200" height="720" fill="#F7F4EC"/>
<rect x="0" y="0" width="1200" height="6" fill="#B57200"/>
<text x="34" y="46" font-size="20" font-weight="bold" fill="#1A1208">Information architecture: before vs after</text>
<text x="34" y="68" font-size="13" fill="#6B6055">Vodacom Engage · 11 flat tiles reorganised into 4 task-based groups with persistent search</text>
<rect x="34" y="92" width="548" height="590" rx="8" fill="#FFFFFF" stroke="#D9D0BE" stroke-width="1.5"/>
<rect x="618" y="92" width="548" height="590" rx="8" fill="#FFFFFF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="58" y="124" font-size="13" font-weight="bold" fill="#C03A08" text-anchor="start">BEFORE — flat 11-tile grid</text>
<text x="642" y="124" font-size="13" font-weight="bold" fill="#17864B" text-anchor="start">AFTER — 4 task groups, search first</text>
