<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Token architecture: three tiers so a rebrand is one file">
<rect width="1240" height="600" fill="#F7F4EC"/>
<rect x="0" y="0" width="1240" height="6" fill="#B57200"/>
<text x="34" y="46" font-size="20" font-weight="bold" fill="#1A1208">Token architecture: three tiers so a rebrand is one file</text>
<text x="34" y="68" font-size="13" fill="#6B6055">Primitives stay dumb, semantics carry meaning, components consume semantics only</text>
<rect x="46" y="110" width="374" height="340" rx="12" fill="#FFFFFF" stroke="#5B34C4" stroke-width="2"/>
<text x="66" y="140" font-size="11" font-weight="bold" fill="#5B34C4" text-anchor="start">TIER 1 · PRIMITIVE</text>
<text x="66" y="160" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">What the value is</text>
<rect x="66" y="182" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="80" y="207" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">orange-500</text>
<text x="384" y="207" font-size="10.5" font-weight="bold" fill="#5B34C4" text-anchor="end">#F0A500</text>
<rect x="66" y="232" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="80" y="257" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">orange-700</text>
<text x="384" y="257" font-size="10.5" font-weight="bold" fill="#5B34C4" text-anchor="end">#C47F00</text>
<rect x="66" y="282" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="80" y="307" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">ink-900</text>
<text x="384" y="307" font-size="10.5" font-weight="bold" fill="#5B34C4" text-anchor="end">#0A0705</text>
<rect x="66" y="332" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="80" y="357" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">space-4</text>
<text x="384" y="357" font-size="10.5" font-weight="bold" fill="#5B34C4" text-anchor="end">16px</text>
<rect x="66" y="382" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="80" y="407" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">radius-md</text>
<text x="384" y="407" font-size="10.5" font-weight="bold" fill="#5B34C4" text-anchor="end">12px</text>
<line x1="420" y1="280" x2="444" y2="280" stroke="#B57200" stroke-width="2"/>
<polygon points="444,280 436.6,283.1 436.6,276.9" fill="#B57200"/>
<rect x="444" y="110" width="374" height="340" rx="12" fill="#FFFFFF" stroke="#0E6E8C" stroke-width="2"/>
<text x="464" y="140" font-size="11" font-weight="bold" fill="#0E6E8C" text-anchor="start">TIER 2 · SEMANTIC</text>
<text x="464" y="160" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">What the value means</text>
<rect x="464" y="182" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="478" y="207" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">action-primary</text>
<text x="782" y="207" font-size="10.5" font-weight="bold" fill="#0E6E8C" text-anchor="end">= orange-500</text>
<rect x="464" y="232" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="478" y="257" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">action-primary-hover</text>
<text x="782" y="257" font-size="10.5" font-weight="bold" fill="#0E6E8C" text-anchor="end">= orange-700</text>
<rect x="464" y="282" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="478" y="307" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">surface-base</text>
<text x="782" y="307" font-size="10.5" font-weight="bold" fill="#0E6E8C" text-anchor="end">= ink-900</text>
<rect x="464" y="332" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="478" y="357" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">gap-card</text>
<text x="782" y="357" font-size="10.5" font-weight="bold" fill="#0E6E8C" text-anchor="end">= space-4</text>
<rect x="464" y="382" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="478" y="407" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">radius-card</text>
<text x="782" y="407" font-size="10.5" font-weight="bold" fill="#0E6E8C" text-anchor="end">= radius-md</text>
<line x1="818" y1="280" x2="842" y2="280" stroke="#B57200" stroke-width="2"/>
<polygon points="842,280 834.6,283.1 834.6,276.9" fill="#B57200"/>
<rect x="842" y="110" width="374" height="340" rx="12" fill="#FFFFFF" stroke="#17864B" stroke-width="2"/>
<text x="862" y="140" font-size="11" font-weight="bold" fill="#17864B" text-anchor="start">TIER 3 · COMPONENT</text>
<text x="862" y="160" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">Where the value is used</text>
<rect x="862" y="182" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="876" y="207" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">button-bg</text>
<text x="1180" y="207" font-size="10.5" font-weight="bold" fill="#17864B" text-anchor="end">= action-primary</text>
<rect x="862" y="232" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="876" y="257" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">button-bg-hover</text>
<text x="1180" y="257" font-size="10.5" font-weight="bold" fill="#17864B" text-anchor="end">= action-primary-hover</text>
<rect x="862" y="282" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="876" y="307" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">card-surface</text>
<text x="1180" y="307" font-size="10.5" font-weight="bold" fill="#17864B" text-anchor="end">= surface-base</text>
<rect x="862" y="332" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="876" y="357" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">card-gap</text>
<text x="1180" y="357" font-size="10.5" font-weight="bold" fill="#17864B" text-anchor="end">= gap-card</text>
<rect x="862" y="382" width="334" height="40" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="876" y="407" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="start">card-radius</text>
<text x="1180" y="407" font-size="10.5" font-weight="bold" fill="#17864B" text-anchor="end">= radius-card</text>
<rect x="46" y="478" width="1150" height="84" rx="8" fill="#FFF6E6" stroke="#B57200" stroke-width="1.5"/>
<text x="66" y="506" font-size="11" font-weight="bold" fill="#B57200" text-anchor="start">WHY IT MATTERS IN PRACTICE</text>
<text x="66" y="530" font-size="11" font-weight="normal" fill="#1A1208" text-anchor="start">A client rebrand touched five primitive values. Nothing in the component layer changed, dark mode kept working, and the whole update shipped in one afternoon.</text>
<text x="66" y="550" font-size="11" font-weight="normal" fill="#6B6055" text-anchor="start">Components never reference a hex value, so a designer can restyle the product without asking an engineer to search the codebase.</text>
<text x="34" y="582" font-size="11" fill="#6B6055">Lulamile Mkhungela · LulaSync — working artifact from the project</text>
</svg>
