<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Conversation design: intent map and fallback ladder">
<rect width="1240" height="780" fill="#F7F4EC"/>
<rect x="0" y="0" width="1240" height="6" fill="#B57200"/>
<text x="34" y="46" font-size="20" font-weight="bold" fill="#1A1208">Conversation design: intent map and fallback ladder</text>
<text x="34" y="68" font-size="13" fill="#6B6055">IT helpdesk assistant · every branch ends in a resolution, a human, or a logged ticket — never a dead end</text>
<rect x="60" y="110" width="220" height="64" rx="10" fill="#FFFFFF" stroke="#1A1208" stroke-width="2"/>
<text x="170" y="138" font-size="12" font-weight="bold" fill="#1A1208" text-anchor="middle">Employee opens chat</text>
<text x="170" y="158" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="middle">“I can&#x27;t connect to the VPN”</text>
<line x1="280" y1="142" x2="346" y2="142" stroke="#B57200" stroke-width="2"/>
<polygon points="346,142 338.6,145.1 338.6,138.9" fill="#B57200"/>
<rect x="350" y="106" width="210" height="74" rx="10" fill="#F1F6F8" stroke="#0E6E8C" stroke-width="2"/>
<text x="455" y="132" font-size="11" font-weight="bold" fill="#0E6E8C" text-anchor="middle">Intent match</text>
<text x="455" y="150" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="middle">18 intents, 340 utterances</text>
<text x="455" y="168" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="middle">confidence threshold 0.75</text>
<line x1="455" y1="180" x2="455" y2="574" stroke="#D9D0BE" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="455" y1="230" x2="596" y2="230" stroke="#17864B" stroke-width="2"/>
<polygon points="596,230 588.6,233.1 588.6,226.9" fill="#17864B"/>
<rect x="600" y="196" width="326" height="74" rx="10" fill="#FFFFFF" stroke="#17864B" stroke-width="2"/>
<text x="618" y="220" font-size="11" font-weight="bold" fill="#17864B" text-anchor="start">Known fix — 62% of chats</text>
<text x="618" y="240" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">Guided steps with screenshots, one step per</text>
<text x="618" y="254" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">message.</text>
<line x1="926" y1="230" x2="958" y2="230" stroke="#D9D0BE" stroke-width="2"/>
<polygon points="958,230 950.6,233.1 950.6,226.9" fill="#D9D0BE"/>
<rect x="958" y="204" width="232" height="52" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="974" y="226" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">Resolved in chat, rated 1 to 5</text>
<line x1="455" y1="342" x2="596" y2="342" stroke="#B57200" stroke-width="2"/>
<polygon points="596,342 588.6,345.1 588.6,338.9" fill="#B57200"/>
<rect x="600" y="308" width="326" height="74" rx="10" fill="#FFFFFF" stroke="#B57200" stroke-width="2"/>
<text x="618" y="332" font-size="11" font-weight="bold" fill="#B57200" text-anchor="start">Needs detail — 23%</text>
<text x="618" y="352" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">Bot asks one question at a time, never a wall</text>
<text x="618" y="366" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">of text.</text>
<line x1="926" y1="342" x2="958" y2="342" stroke="#D9D0BE" stroke-width="2"/>
<polygon points="958,342 950.6,345.1 950.6,338.9" fill="#D9D0BE"/>
<rect x="958" y="316" width="232" height="52" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="974" y="338" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">Resolved or ticket pre-filled</text>
<line x1="455" y1="454" x2="596" y2="454" stroke="#0E6E8C" stroke-width="2"/>
<polygon points="596,454 588.6,457.1 588.6,450.9" fill="#0E6E8C"/>
<rect x="600" y="420" width="326" height="74" rx="10" fill="#FFFFFF" stroke="#0E6E8C" stroke-width="2"/>
<text x="618" y="444" font-size="11" font-weight="bold" fill="#0E6E8C" text-anchor="start">Low confidence — 11%</text>
<text x="618" y="464" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">Shows the three closest options instead of</text>
<text x="618" y="478" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">guessing.</text>
<line x1="926" y1="454" x2="958" y2="454" stroke="#D9D0BE" stroke-width="2"/>
<polygon points="958,454 950.6,457.1 950.6,450.9" fill="#D9D0BE"/>
<rect x="958" y="428" width="232" height="52" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="974" y="450" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">User picks the right intent</text>
<line x1="455" y1="566" x2="596" y2="566" stroke="#C03A08" stroke-width="2"/>
<polygon points="596,566 588.6,569.1 588.6,562.9" fill="#C03A08"/>
<rect x="600" y="532" width="326" height="74" rx="10" fill="#FFFFFF" stroke="#C03A08" stroke-width="2"/>
<text x="618" y="556" font-size="11" font-weight="bold" fill="#C03A08" text-anchor="start">Out of scope — 4%</text>
<text x="618" y="576" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">Hands over to a human with the full transcript</text>
<text x="618" y="590" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">attached.</text>
<line x1="926" y1="566" x2="958" y2="566" stroke="#D9D0BE" stroke-width="2"/>
<polygon points="958,566 950.6,569.1 950.6,562.9" fill="#D9D0BE"/>
<rect x="958" y="540" width="232" height="52" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="974" y="562" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">Warm handover, nothing</text>
<text x="974" y="576" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">repeated</text>
<rect x="60" y="230" width="340" height="330" rx="8" fill="#FFFFFF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="80" y="262" font-size="11" font-weight="bold" fill="#B57200" text-anchor="start">WRITING RULES I SET</text>
<text x="80" y="292" font-size="10.5" font-weight="normal" fill="#6B6055" text-anchor="start">✓ One idea per bubble, 220 characters</text>
<text x="80" y="306" font-size="10.5" font-weight="normal" fill="#6B6055" text-anchor="start">maximum.</text>
<text x="80" y="330" font-size="10.5" font-weight="normal" fill="#6B6055" text-anchor="start">✓ Always say what happens next.</text>
<text x="80" y="368" font-size="10.5" font-weight="normal" fill="#6B6055" text-anchor="start">✓ Never apologise twice in a row.</text>
<text x="80" y="406" font-size="10.5" font-weight="normal" fill="#6B6055" text-anchor="start">✓ Plain South African English, no IT</text>
<text x="80" y="420" font-size="10.5" font-weight="normal" fill="#6B6055" text-anchor="start">jargon.</text>
<text x="80" y="444" font-size="10.5" font-weight="normal" fill="#6B6055" text-anchor="start">✓ Offer “talk to a person” from message</text>
<text x="80" y="458" font-size="10.5" font-weight="normal" fill="#6B6055" text-anchor="start">two.</text>
<text x="80" y="482" font-size="10.5" font-weight="normal" fill="#6B6055" text-anchor="start">✓ Confirm the fix worked before closing.</text>
<text x="80" y="520" font-size="10.5" font-weight="normal" fill="#6B6055" text-anchor="start">✓ Log every unmatched question for the</text>
<text x="80" y="534" font-size="10.5" font-weight="normal" fill="#6B6055" text-anchor="start">next release.</text>
<rect x="60" y="620" width="1130" height="88" rx="8" fill="#FFF6E6" stroke="#B57200" stroke-width="1.5"/>
<text x="80" y="650" font-size="11" font-weight="bold" fill="#B57200" text-anchor="start">MEASURED AFTER EIGHT WEEKS</text>
<text x="80" y="676" font-size="11" font-weight="normal" fill="#1A1208" text-anchor="start">Containment 41% → 68%  ·  average resolution 6m10s → 2m40s  ·  repeat contacts on the same issue down by a third</text>
<text x="80" y="696" font-size="11" font-weight="normal" fill="#6B6055" text-anchor="start">CSAT 4.3 out of 5 across 612 rated chats  ·  every unmatched question reviewed weekly and turned into content.</text>
<text x="34" y="762" font-size="11" fill="#6B6055">Lulamile Mkhungela · LulaSync — working artifact from the project</text>
</svg>
