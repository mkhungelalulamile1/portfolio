<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Service blueprint: bursary application, end to end">
<rect width="1240" height="780" fill="#F7F4EC"/>
<rect x="0" y="0" width="1240" height="6" fill="#B57200"/>
<text x="34" y="46" font-size="20" font-weight="bold" fill="#1A1208">Service blueprint: bursary application, end to end</text>
<text x="34" y="68" font-size="13" fill="#6B6055">Where the applicant, the front stage, the back stage and the systems meet — and where applications used to die</text>
<rect x="34" y="138" width="1172" height="104" rx="8" fill="#FFFFFF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="50" y="164" font-size="10" font-weight="bold" fill="#1A1208" text-anchor="start">APPLICANT ACTION</text>
<text x="214" y="164" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Sees a poster or a</text>
<text x="214" y="178" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">WhatsApp forward</text>
<text x="380" y="164" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Reads 9 criteria in a</text>
<text x="380" y="178" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">PDF</text>
<text x="546" y="164" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Certified copies, ID,</text>
<text x="546" y="178" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">results</text>
<text x="712" y="164" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Fills a 42-field form</text>
<text x="878" y="164" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">No status for 6 weeks</text>
<text x="1044" y="164" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Email that may go to</text>
<text x="1044" y="178" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">spam</text>
<rect x="34" y="248" width="1172" height="104" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="50" y="274" font-size="10" font-weight="bold" fill="#0E6E8C" text-anchor="start">FRONT STAGE</text>
<text x="214" y="274" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Campus notice and social</text>
<text x="214" y="288" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">post</text>
<text x="380" y="274" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Eligibility checker, 5</text>
<text x="380" y="288" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">questions</text>
<text x="546" y="274" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Checklist with real</text>
<text x="546" y="288" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">examples</text>
<text x="712" y="274" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Guided 4-step form that</text>
<text x="712" y="288" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">saves</text>
<text x="878" y="274" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Status tracker with</text>
<text x="878" y="288" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">dates</text>
<text x="1044" y="274" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Result plus clear next</text>
<text x="1044" y="288" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">steps</text>
<rect x="34" y="358" width="1172" height="104" rx="8" fill="#FFFFFF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="50" y="384" font-size="10" font-weight="bold" fill="#5B34C4" text-anchor="start">BACK STAGE</text>
<text x="214" y="384" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Comms plan per campus</text>
<text x="380" y="384" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Rules written with the</text>
<text x="380" y="398" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">panel</text>
<text x="546" y="384" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Support desk scripts</text>
<text x="712" y="384" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Screening queue with</text>
<text x="712" y="398" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">flags</text>
<text x="878" y="384" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Panel review calendar</text>
<text x="1044" y="384" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Placement and onboarding</text>
<rect x="34" y="468" width="1172" height="104" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="50" y="494" font-size="10" font-weight="bold" fill="#6B6055" text-anchor="start">SYSTEMS</text>
<text x="214" y="494" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">CMS and WhatsApp</text>
<text x="214" y="508" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">broadcast</text>
<text x="380" y="494" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Rules engine</text>
<text x="546" y="494" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Upload with 8 MB cap</text>
<text x="712" y="494" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Application API,</text>
<text x="712" y="508" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">autosave</text>
<text x="878" y="494" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Notification service</text>
<text x="1044" y="494" font-size="9.5" font-weight="normal" fill="#6B6055" text-anchor="start">Records and reporting</text>
<rect x="34" y="578" width="1172" height="132" rx="8" fill="#FFFFFF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="50" y="604" font-size="10" font-weight="bold" fill="#C03A08" text-anchor="start">PAIN → FIX I SHIPPED</text>
<text x="214" y="604" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">Nobody knew the deadline</text>
<text x="214" y="618" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">→ countdown on every</text>
<text x="214" y="632" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">entry point</text>
<text x="380" y="604" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">Guessing wasted panel</text>
<text x="380" y="618" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">time → checker filters</text>
<text x="380" y="632" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">early</text>
<text x="546" y="604" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">Wrong file types caused</text>
<text x="546" y="618" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">rejections → upload</text>
<text x="546" y="632" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">validates instantly</text>
<text x="712" y="604" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">42 fields on one page →</text>
<text x="712" y="618" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">4 short steps,</text>
<text x="712" y="632" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">completion 38% → 61%</text>
<text x="878" y="604" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">Silence caused calls →</text>
<text x="878" y="618" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">tracker halved status</text>
<text x="878" y="632" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">calls</text>
<text x="1044" y="604" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">Cold rejection → reasons</text>
<text x="1044" y="618" font-size="9.5" font-weight="bold" fill="#1A1208" text-anchor="start">plus what to do next</text>
<text x="284" y="116" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="middle">Hears about it</text>
<line x1="364" y1="126" x2="364" y2="710" stroke="#D9D0BE" stroke-width="1" stroke-dasharray="3 3"/>
<text x="450" y="116" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="middle">Checks if she qualifies</text>
<line x1="530" y1="126" x2="530" y2="710" stroke="#D9D0BE" stroke-width="1" stroke-dasharray="3 3"/>
<text x="616" y="116" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="middle">Gathers documents</text>
<line x1="696" y1="126" x2="696" y2="710" stroke="#D9D0BE" stroke-width="1" stroke-dasharray="3 3"/>
<text x="782" y="116" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="middle">Applies</text>
<line x1="862" y1="126" x2="862" y2="710" stroke="#D9D0BE" stroke-width="1" stroke-dasharray="3 3"/>
<text x="948" y="116" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="middle">Waits</text>
<line x1="1028" y1="126" x2="1028" y2="710" stroke="#D9D0BE" stroke-width="1" stroke-dasharray="3 3"/>
<text x="1114" y="116" font-size="11" font-weight="bold" fill="#1A1208" text-anchor="middle">Outcome</text>
<text x="34" y="744" font-size="11" font-weight="normal" fill="#6B6055" text-anchor="start">Line of interaction sits under lane 1, line of visibility under lane 2. Every fix below the line changed something the applicant can feel.</text>
<text x="34" y="762" font-size="11" fill="#6B6055">Lulamile Mkhungela · LulaSync — working artifact from the project</text>
</svg>
