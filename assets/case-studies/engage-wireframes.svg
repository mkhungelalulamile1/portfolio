<text x="180" y="291" font-size="9" font-weight="normal" fill="#6B6055" text-anchor="middle">Tile</text>
<rect x="218" y="258" width="64" height="58" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="250" y="291" font-size="9" font-weight="normal" fill="#6B6055" text-anchor="middle">Tile</text>
<rect x="78" y="324" width="64" height="58" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="110" y="357" font-size="9" font-weight="normal" fill="#6B6055" text-anchor="middle">Tile</text>
