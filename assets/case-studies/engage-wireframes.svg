<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Lo-fi wireframes: three home-screen options tested with 9 employees">
<rect width="1240" height="700" fill="#F7F4EC"/>
<rect x="0" y="0" width="1240" height="6" fill="#B57200"/>
<text x="34" y="46" font-size="20" font-weight="bold" fill="#1A1208">Lo-fi wireframes: three home-screen options tested with 9 employees</text>
<text x="34" y="68" font-size="13" fill="#6B6055">Vodacom Engage · paper to Figma, tested as clickable prototypes before any visual design</text>
<rect x="60" y="120" width="240" height="400" rx="18" fill="#FFFFFF" stroke="#D9D0BE" stroke-width="2"/>
