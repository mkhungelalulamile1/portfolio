<text x="180" y="106" font-size="12" font-weight="bold" fill="#1A1208" text-anchor="middle">Option A — search + recents</text>
<rect x="76" y="154" width="208" height="26" rx="8" fill="#FBF7EF" stroke="#D9D0BE" stroke-width="1.5"/>
<text x="86" y="171" font-size="10" font-weight="normal" fill="#6B6055" text-anchor="start">Search</text>
